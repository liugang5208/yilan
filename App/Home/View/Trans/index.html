<style>
    .disflex{ text-align:center;}
    .disitem img{ width:40%;}
    .disblok p{ margin:0px; min-height:25px; line-height:25px}
    .disitemright{ text-align: center;}
</style>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>物流公司</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <!--ol class="breadcrumb text-right">
                        <li><a href="#">Dashboard</a></li>
                        <li class="active">UI-Blank</li>
                    </ol-->
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">

        <div class="row">

            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>物流公司</h4>
                        <div class="card-header-right-icon">
                            <ul>
                                <li class="doc-link">
                                    <a class="btn btn-xs btn-info" data-toggle="modal" data-target="#myModal">添加物流公司</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <tbody>

                                <volist name="list.list" id="v">

                                    <tr>
                                        <td class="disflex" width="20%">
                                            <div class="disitem">
                                                <div id="namekey">搜索图</div>
                                                <img src="__PUBLIC__/uploads/trans/{$v.search}"/>
                                            </div>
                                        </td>
                                        <td class="disflex" width="20%">
                                            <div class="disitem">
                                                <div id="namekey">详情图</div>
                                                <img src="__PUBLIC__/uploads/trans/{$v.source}"/>
                                            </div>
                                        </td>
                                        <td class="disblok" width="30%">
                                            <p>物流名称：{$v.name}</p>
                                            <p>始发地点：{$v.base_addr}</p>
                                            <p>专线往返：{$v.line_trans}</p>
                                            <p>代收发放时间：{$v.agent_save}</p>
                                            <p>代收查询电话：{$v.agent_phone}</p>
                                            <p>路线关键词：{$v.line_keys}</p>
                                            <!--p>名称关键词：{$show_type|showType=$v['show_type'],###}</p-->
                                        </td>
                                        <td>
                                            <div class="disitemright">
                                                <br/><br/>
                                                <a href="javascript:addSearchImg('{$v.id}');" class="btn btn-info btn-xs">搜索图片</a>
                                                <a href="javascript:addShowImg('{$v.id}');" class="btn btn-info btn-xs">详情图片</a>
                                                <a href="{:U('Trans/index_edits','id='.$v['id'])}" class="btn btn-info btn-xs">编辑信息</a>
                                                <a href="{:U('Trans/index_logs','id='.$v['id'].'&pid='.$id)}" class="btn btn-info btn-xs">站点管理</a>
                                                <a href="javascript:dels('{$v.id}');" class="btn btn-danger btn-xs">删除</a>
                                            </div>
                                        </td>
                                    </tr>
                                </volist>

                                </tbody>
                            </table>

                            <nav aria-label="Page navigation">
                                <ul class="pagination">{$list.show}</ul>
                            </nav>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">添加物流公司</h4>
                </div>
                <div class="modal-body">
                    <form>
                        <input type="hidden" name="pid" value="{$id}"/>
                        <input type="hidden" name="trans_type" value="2"/>
                        <input type="hidden" name="line_prov" value="0"/>
                        <input type="hidden" name="line_city" value="0"/>
                        <input type="hidden" name="line_label" value="0"/>

                        <div class="row">
                            <div class="col-md-4">

                                <!--div class="form-group">
                                    <label>发货类型</label>
                                    <select name="trans_type" class="form-control input-sm">
                                        <option value="">请选择</option>
                                        <option value="0">发货商店</option>
                                        <option value="1">取货商店</option>
                                        <option value="2">又发又收</option>
                                    </select>
                                </div-->
                                <div class="form-group">
                                    <label>物流公司名称</label>
                                    <input type="text" name="name" class="form-control input-sm"/>
                                </div>
                                <div class="form-group">
                                    <label>专线往返</label>
                                    <input type="text" name="line_trans" class="form-control input-sm"/>
                                </div>
                                <div class="form-group">
                                    <label>线路关键词</label>
                                    <input type="text" name="line_keys" class="form-control input-sm"/>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>代收发送</label>
                                    <input type="text" name="agent_save" class="form-control input-sm"/>
                                </div>
                                <div class="form-group">
                                    <label>代收查询</label>
                                    <input type="text" name="agent_phone" class="form-control input-sm"/>
                                </div>
                                <div class="form-group">
                                    <label>总部电话</label>
                                    <input type="text" name="telephone" class="form-control input-sm"/>
                                </div>
                            </div>
                            <div class="col-md-4">


                                <div class="form-group">
                                    <label>公司地址</label>
                                    <input type="text" name="addr" class="form-control input-sm"/>
                                </div>
                                <div class="form-group">
                                    <label>状态</label>
                                    <select name="status" class="form-control input-sm">
                                        <option value="1">使用</option>
                                        <option value="0">暂停</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addor()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="searchmoel" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document" style="width:25%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">更新物流搜索图</h4>
                </div>
                <div class="modal-body">

                    <form name="search">
                        <input type="hidden" name="ids" value="0" id="searchID"/>
                        <div class="form-group">
                            <label>搜索图</label>
                            <input type="file" name="search" id="searchr" class="form-control input-sm"/>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addSearch()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="shows" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document" style="width:25%;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">更新物流详情图片</h4>
                </div>
                <div class="modal-body">

                    <form name="source">
                        <input type="hidden" name="ids" value="0" id="showID"/>
                        <div class="form-group">
                            <label>详情图</label>
                            <input type="file" name="source" id="source" class="form-control input-sm"/>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addImg()">添加</button>
                </div>
            </div>
        </div>
    </div>

</div>


<script>

    /**
     * 获取城市区域
     * @param {type} id
     * @param {type} target
     * @param {type} par
     * @returns {undefined}
     */
    function getRegion(id, target, par) {
        var data = {pid: id};
        $.ajax({
            url: "{:U('Comm/region')}",
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                ///////
                var html = "<option value=''>请选择</option>";
                for (var i = 0; i < res.data.length; i++) {
                    html += "<option value='" + res.data[i]["id"] + "'>" + res.data[i]["name"] + "</option>";
                }
                $("select[name='" + target + "']").html(html);
            },
            error: function () {

            },
        });
    }

    /**
     * 添加
     * @returns {undefined}
     */
    function addor() {
        var temp = $("form").serializeArray();
        var data = objToArray(temp);
        var baseurl = "{:U('Core/addon','model=trans')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

    /**
     * 删除
     * @returns {undefined}
     */
    function dels(id) {
        var data = {id: id};
        var baseurl = "{:U('Core/dels','model=trans')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

    ////////////////////////////////////////////////////////////////////////////

    function addSearchImg(id) {
        $("#searchID").val(id);
        $("#searchmoel").modal("show");
    }

    function addSearch() {
        var temp = $("form[name='search']").serializeArray();
        var data = objToArray(temp);
        /////////
        $.ajaxFileUpload({
            url: "{:U('Trans/index_upsearch')}",
            secureuri: false,
            fileElementId: "searchr",
            dataType: 'json',
            data: data,
            success: function (data) {
                if (data.status !== 1) {
                    return swal("错误", data.msg, "error");
                }
                window.location.reload();
            },
            error: function (data) {
                console.log(data);
            }
        });
    }

    ////////////////////////////////////////////////////////////////////////////

    function addShowImg(id) {
        $("#showID").val(id);
        $("#shows").modal("show");
    }

    function addImg() {
        var temp = $("form[name='source']").serializeArray();
        var data = objToArray(temp);
        /////////
        $.ajaxFileUpload({
            url: "{:U('Trans/index_upfile')}",
            secureuri: false,
            fileElementId: "source",
            dataType: 'json',
            data: data,
            success: function (data) {
                if (data.status !== 1) {
                    return swal("错误", data.msg, "error");
                }
                window.location.reload();
            },
            error: function (data) {
                console.log(data);
            }
        });
    }

</script>
