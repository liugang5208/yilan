<style>
    /* ===== 苹果极简商务风：全局容器与排版样式 ===== */
    .apple-backend-container {
        background-color: #f5f5f7;
        padding: 24px 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1d1d1f;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
    }

    .apple-row {
        margin-bottom: 0;
        width: 100%;
    }

    /* ===== 苹果高档质感卡片 ===== */
    .apple-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.04);
        margin-bottom: 0;
        overflow: hidden;
        transition: all 0.3s ease;
        width: 100%;
    }

    .apple-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2c3e50;
        color: #fff;
        padding: 18px 24px;
        border-bottom: none;
    }

    .card-title-text {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .apple-header-add-btn {
        font-size: 13px !important;
        padding: 7px 16px !important;
        height: auto !important;
        border-radius: 8px !important;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        background: rgba(255, 255, 255, 0.15) !important;
        color: #fff !important;
        transition: all 0.2s ease;
    }
    .apple-header-add-btn:hover {
        background: rgba(255, 255, 255, 0.3) !important;
    }

    .apple-card-body {
        padding: 24px;
    }

    /* ===== 表格样式优化（全屏无极铺开，告别左右挤压） ===== */
    .apple-table-wrapper {
        border-radius: 12px;
        border: 1px solid #e5e5ea;
        overflow: hidden;
        background: #ffffff;
        width: 100%;
    }

    .apple-table {
        margin-bottom: 0 !important;
        background-color: #ffffff;
        width: 100%;
        table-layout: fixed; /* 固定列宽，结构严谨有序 */
    }

    .apple-table th {
        background: #fafafc !important;
        color: #1d1d1f !important;
        font-weight: 600 !important;
        border-bottom: 1px solid #e5e5ea !important;
        padding: 16px 12px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .apple-table td {
        padding: 14px 12px !important;
        vertical-align: middle !important;
        border-color: #f0f0f2 !important;
        color: #1d1d1f;
        word-break: break-all;
    }

    /* 奇偶行交叉底色，辨识度高 */
    .apple-table tbody tr:nth-of-type(odd) {
        background-color: #fbfbfd;
    }

    .apple-table tbody tr:hover {
        background-color: #f5f5f7;
    }

    .badge-number {
        font-weight: 600;
        color: #86868b;
        background: #f0f0f2;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 13px;
    }

    .text-bold-name {
        font-weight: 600;
        color: #1d1d1f;
        font-size: 14px;
    }

    .status-badge-normal {
        background: #eef6ed;
        color: #34c759;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
    }

    .status-badge-pause {
        background: #fdf2f2;
        color: #ff3b30;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
    }

    /* ==========================================
       核心精准改良区：在您圈定的红框范围内，适当加大间距，彼此分开但不贴边、不挤成一坨
       ========================================== */
    .table-action-group {
        display: flex;
        justify-content: center; /* 整体居中稳妥收敛在红框区域内 */
        align-items: center;
        gap: 14px; /* 完美微调：将间距从之前的 8px 适当加大到 14px，让图标彼此舒展开、不再挤成一团！ */
        width: 100%;
        padding: 0 12px; /* 左右保留安全留白，绝对不贴到格子的边沿去 */
        box-sizing: border-box;
        flex-wrap: nowrap; /* 绝对禁止换行 */
    }

    /* 按钮保持精炼紧凑的原样大小，绝对不被拉长变形 */
    .btn-action-base {
        border: none !important;
        border-radius: 6px !important;
        padding: 5px 8px !important; /* 小巧精致的内边距 */
        font-weight: 500 !important;
        color: #fff !important;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        transition: all 0.2s ease;
        white-space: nowrap;
        flex-shrink: 0; /* 强制不许拉伸、不许压缩 */
    }

    .btn-action-ad { background-color: #5856D6 !important; }
    .btn-action-goods { background-color: #0071E3 !important; }
    .btn-action-up { background-color: #34C759 !important; }
    .btn-action-down { background-color: #FF9500 !important; }
    .btn-action-edit { background-color: #8E8E93 !important; }
    .btn-action-del { background-color: #FF3B30 !important; }

    .btn-action-base:hover { opacity: 0.85; filter: brightness(1.05); }

    .apple-pagination-box {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
    }

    /* ===== 弹窗精细化控制 ===== */
    .apple-modal .modal-dialog {
        max-width: 480px;
        margin: 40px auto;
    }

    .apple-modal .modal-content {
        border-radius: 16px;
        border: none;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        background: #ffffff;
        overflow: hidden;
    }

    .apple-modal .modal-header {
        background: #fafafc;
        border-bottom: 1px solid #e5e5ea;
        padding: 16px 20px;
    }

    .apple-modal .modal-title {
        font-weight: 600;
        color: #1d1d1f;
        font-size: 16px;
    }

    .apple-modal .modal-body {
        padding: 24px 20px;
    }

    .apple-modal .form-group {
        margin-bottom: 16px;
    }

    .apple-modal .form-group label {
        font-weight: 600;
        color: #1d1d1f;
        font-size: 13px;
        margin-bottom: 6px;
        display: block;
    }

    .apple-input {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        height: 40px !important;
        box-shadow: none !important;
        transition: all 0.2s;
    }
    .apple-input:focus {
        border-color: #0071e3 !important;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15) !important;
    }

    .apple-modal .modal-footer {
        background: #fafafc;
        border-top: 1px solid #e5e5ea;
        padding: 12px 20px;
        display: flex !important;
        align-items: center;
        justify-content: flex-end !important;
        gap: 10px;
    }

    .apple-btn-primary {
        background: #0071e3 !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 8px 18px !important;
        font-weight: 500 !important;
        color: #fff !important;
        height: 38px;
    }
    .apple-btn-primary:hover { background: #0077ed !important; }

    .apple-btn-default {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        background: #ffffff !important;
        color: #1d1d1f !important;
        padding: 8px 18px !important;
        height: 38px;
    }
    .apple-btn-default:hover {
        background: #f0f0f5 !important;
        border-color: #c7c7cc !important;
    }

    /* ==========================================
       移动端响应式降级：卡片式折叠布局（拇指法则优化）
       ========================================== */
    @media (max-width: 768px) {
        .apple-backend-container {
            padding: 12px;
        }

        .apple-card-body {
            padding: 12px;
        }

        .apple-table, .apple-table thead, .apple-table tbody, .apple-table tr, .apple-table td {
            display: block;
            width: 100% !important;
        }

        .apple-table thead {
            display: none;
        }

        .apple-table tbody tr {
            background: #ffffff !important;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .apple-table tbody td {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 !important;
            border: none !important;
            text-align: right;
        }

        .apple-table tbody td::before {
            content: attr(data-label);
            font-weight: 600;
            color: #86868b;
            text-align: left;
            font-size: 13px;
        }

        .table-action-group {
            justify-content: flex-end;
            width: 100%;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f2;
            padding-left: 0;
            padding-right: 0;
            gap: 8px;
            flex-wrap: wrap; /* 手机端空间有限，允许折叠排布防止变形 */
        }

        .btn-action-base {
            padding: 8px 12px !important;
            height: 38px !important;
            flex: 1 1 30%;
            font-size: 12px;
        }

        .apple-modal .modal-dialog {
            width: 90% !important;
            margin: 20px auto !important;
        }
    }
</style>

<div class="container-fluid apple-backend-container" ng-app="myApp" ng-controller="myCtrl">
    <section id="main-content">
        <div class="row apple-row">
            <div class="col-lg-12">
                <div class="apple-card">
                    <div class="card-header apple-card-header">
                        <span class="card-title-text">线缆板块管理</span>
                        <div class="card-header-right-icon">
                            <a class="btn btn-xs apple-header-add-btn" data-toggle="modal" data-target="#myModal">+ 添加线缆板块</a>
                        </div>
                    </div>
                    <div class="card-body apple-card-body">
                        <div class="table-responsive apple-table-wrapper">
                            <table class="table table-hover apple-table">
                                <!-- 精准划分各列宽度，确保管理操作区完美契合您画的红框范围 -->
                                <colgroup>
                                    <col style="width: 70px;">
                                    <col style="width: 18%;">
                                    <col style="width: 80px;">
                                    <col style="width: 90px;">
                                    <col style="width: 180px;">
                                    <col style="width: 440px;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>#序号</th>
                                        <th>名称</th>
                                        <th>排序</th>
                                        <th>状态</th>
                                        <th>记录时间</th>
                                        <th style="text-align: center;">管理操作区</th>
                                    </tr>
                                </thead>
                                <tbody>

                                <volist name="list.list" id="v" key="k">
                                    <tr>
                                        <td data-label="序号">
                                            <span class="badge-number">{$k}</span>
                                        </td>
                                        <td data-label="名称">
                                            <span class="text-bold-name">{$v.name}</span>
                                        </td>
                                        <td data-label="排序">
                                            <span class="badge-number">{$v.sorts}</span>
                                        </td>
                                        <td data-label="状态">
                                            <if condition="$v['status'] gt 0">
                                                <span class="status-badge-normal">正常</span>
                                            <else />
                                                <span class="status-badge-pause">暂停使用</span>
                                            </if>
                                        </td>
                                        <td data-label="记录时间">
                                            <span style="color: #86868b; font-size: 13px;">{$v.times|date='Y/m/d H:i:s',###}</span>
                                        </td>
                                        <td data-label="管理操作" style="text-align: center; padding: 14px 0;">
                                            <!-- 按钮大小保持原样，在红框范围内适当加大间距、互不拥挤、绝不贴边 -->
                                            <div class="table-action-group">
                                                <a href="{:U('Goods/plate_banner','id='.$v['id'])}" class="btn btn-xs btn-action-base btn-action-ad">广告管理</a>
                                                <a href="{:U('Goods/plate_infos','id='.$v['id'])}" class="btn btn-xs btn-action-base btn-action-goods">商品管理</a>
                                                <a ng-click="changeid('{$v.id}', 0)" class="btn btn-xs btn-action-base btn-action-up">上调</a>
                                                <a ng-click="changeid('{$v.id}', 1)" class="btn btn-xs btn-action-base btn-action-down">下调</a>
                                                <a ng-click="updateInfo('{$v.id}')" class="btn btn-xs btn-action-base btn-action-edit">编辑</a>
                                                <a ng-click="dels('{$v.id}')" class="btn btn-xs btn-action-base btn-action-del">删除</a>
                                            </div>
                                        </td>
                                    </tr>
                                </volist>

                                </tbody>
                            </table>

                            <div class="apple-pagination-box">
                                <nav aria-label="Page navigation">
                                    <ul class="pagination">{$list.show}</ul>
                                </nav>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>

    </section>

    <!-- Modal -->
    <div class="modal fade apple-modal" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">添加线缆板块</h4>
                </div>
                <div class="modal-body">

                    <form name="addon">
                        <input type="hidden" name="types" value="1"/>

                        <div class="form-group">
                            <label>名称</label>
                            <input type="text" name="name" class="form-control apple-input" placeholder="请输入板块名称"/>
                        </div>
                        <div class="form-group">
                            <label>排序</label>
                            <input type="number" name="sorts" class="form-control apple-input" value="0"/>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control apple-input">
                                <option value="1">使用</option>
                                <option value="0">暂停</option>
                            </select>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default apple-btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary apple-btn-primary" ng-click="addor()">确认添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade apple-modal" id="myEdits" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">修改线缆板块</h4>
                </div>
                <div class="modal-body">

                    <form name="edit">

                        <div class="form-group">
                            <label>名称</label>
                            <input type="text" name="name" class="form-control apple-input" ng-model="lininfo.name"/>
                        </div>
                        <div class="form-group">
                            <label>排序</label>
                            <input type="text" name="sorts" class="form-control apple-input" ng-model="lininfo.sorts"/>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control apple-input" ng-model="lininfo.status">
                                <option value="1">使用</option>
                                <option value="0">暂停</option>
                            </select>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default apple-btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary apple-btn-primary" ng-click="updateOp()">确认更新</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>

    var app = angular.module('myApp', []);
    app.controller('myCtrl', function ($scope, $http) {

        $scope.lininfo;

        ////////////////////////////////////////////////////////////////////////

        /**
         * 通讯操作
         * @param {type} url
         * @param {type} data
         * @returns {undefined}
         */
        $scope.commAjax = function (url, data, success) {
            $http({
                method: "POST",
                url: url,
                data: data,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                transformRequest: function (obj) {
                    var str = [];
                    for (var p in obj) {
                        str.push(encodeURIComponent(p) + "=" + encodeURIComponent(obj[p]));
                    }
                    return str.join("&");
                }
            }).success(function (response) {
                success(response);
            });
        };

        ////////////////////////////////////////////////////////////////////////

        $scope.addor = function () {
            var temp = $("form[name='addon']").serializeArray();
            var data = objToArray(temp);
            /////////
            $.ajaxFileUpload({
                url: "{:U('Core/addon','model=plate_types')}",
                secureuri: false,
                fileElementId: "file",
                dataType: 'json',
                data: data,
                success: function (data) {
                    if (data.status !== 1) {
                        return swal("错误", data.msg, "error");
                    }
                    window.location.reload();
                },
                error: function (data) {
                    console.log(data);
                }
            });
        }

        $scope.updateInfo = function (id) {
            $scope.commAjax("{:U('Core/infos','model=plate_types')}", {ids: id}, function (res) {
                $scope.lininfo = res.data;
                $("#myEdits").modal("show");
            });
        }

        $scope.updateOp = function () {
            var param = $scope.lininfo;
            param.ids = param.id;
            /////
            $scope.commAjax("{:U('Core/edits','model=plate_types')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

        $scope.dels = function (ids) {
            var param = {id: ids};
            $scope.commAjax("{:U('Core/dels','model=plate_types')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

        ////////////////////////////////////////////////////////////////////////

        $scope.changeid = function (id, type) {
            var param = {id: id, redi: type};
            $scope.commAjax("{:U('Core/uptypes')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

    });

</script>
