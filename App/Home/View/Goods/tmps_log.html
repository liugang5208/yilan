<div class="container-fluid" ng-app="myApp" ng-controller="myCtrl">

    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>商品模板详情</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <ol class="breadcrumb text-right">
                        <li><a href="{:U('Goods/tmps')}">商品模板</a></li>
                        <li class="active">商品模板详情</li>
                    </ol>
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">


        <div class="col-lg-12">
            <div class="card alert">
                <div class="card-header">
                    <h4>商品模板详情</h4>
                    <div class="card-header-right-icon">
                        <ul>
                            <li class="doc-link">
                                <a class="btn btn-xs btn-info" ng-click="addor()">添加商品模板记录</a>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th ng-if="typer < 2">规格分类名称</th>
                                    <th ng-if="typer > 1">关键词</th>
                                    <th ng-if="typer > 1">值</th>
                                    <th ng-if="typer > 1">关键词1</th>
                                    <th ng-if="typer > 1">值1</th>
                                    <th ng-if="typer > 1">关键词2</th>
                                    <th ng-if="typer > 1">值2</th>
                                    <th>价格</th>
                                    <th ng-if="typer > 1">发货时间</th>
                                    <th width="20%">管理</th>
                                </tr>
                            </thead>
                            <tbody>

                            <volist name="list.list" id="v" key="k">
                                <form name="list_{$v.id}">
                                    <tr>
                                        <th scope="row">{$k}</th>
                                        <td class="{$info['types']<2?'':'none'}"><input type="text" class="form-control input-sm" name="name" value="{$v.name}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="key_0" value="{$v.key_0}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="value_0" value="{$v.value_0}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="key_1" value="{$v.key_1}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="value_1" value="{$v.value_1}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="key_2" value="{$v.key_2}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="value_2" value="{$v.value_2}"/></td>
                                        <td><input type="text" name="price" class="form-control input-sm" value="{$v.price}"/></td>
                                        <td class="{$info['types']>1?'':'none'}"><input type="text" class="form-control input-sm" name="trans" value="{$v.trans}"/></td>
                                        <td>
                                            <a class="btn btn-info btn-xs" ng-click="updatr('{$v.id}')">更新</a>
                                            <a ng-click="dels('{$v.id}')" class="btn btn-danger btn-xs">删除</a>
                                        </td>
                                    </tr>
                                </form>
                            </volist>

                            </tbody>
                        </table>

                        <nav aria-label="Page navigation">
                            <ul class="pagination">{$list.show}</ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>


    </section>

</div>

<script>

    var app = angular.module('myApp', []);
    app.controller('myCtrl', function ($scope, $http) {

        $scope.typer = "{$info.types}";

        ////////////////////////////////////////////////////////////////////////

        /**
         * 通讯操作
         * @param {type} url
         * @param {type} data
         * @returns {undefined}
         */
        $scope.commAjax = function (url, data, success) {
            $http({
                method: "POST",
                url: url,
                data: data,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                transformRequest: function (obj) {
                    var str = [];
                    for (var p in obj) {
                        str.push(encodeURIComponent(p) + "=" + encodeURIComponent(obj[p]));
                    }
                    return str.join("&");
                }
            }).success(function (response) {
                success(response);
            });
        };

        ////////////////////////////////////////////////////////////////////////

        /**
         * 添加
         * @param {type} id
         * @returns {undefined}
         */
        $scope.addor = function () {
            $scope.commAjax("{:U('Goods/tmps_log_add')}", {id: "{$info.id}"}, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

        /**
         * 更新
         * @param {type} id
         * @returns {undefined}
         */
        $scope.updatr = function (id) {
            var temp = $("form[name='list_" + id + "']").serializeArray();
            var data = objToArray(temp);
            data.ids = id;
            /////////
            $scope.commAjax("{:U('Core/edits','model=sys_tmps_logs')}", data, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

        $scope.dels = function (ids) {
            var param = {id: ids};
            $scope.commAjax("{:U('Core/dels','model=sys_tmps_logs')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

    });

</script>
