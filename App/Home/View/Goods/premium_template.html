<style>
    /* ===== 苹果极简商务风：全局容器与排版样式（与本项目其它管理页保持一致） ===== */
    .apple-backend-container {
        background-color: #f5f5f7;
        padding: 24px 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1d1d1f;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
    }

    .apple-row {
        margin-bottom: 20px;
        width: 100%;
    }

    .apple-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.04);
        margin-bottom: 0;
        overflow: hidden;
        width: 100%;
    }

    .apple-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2c3e50;
        color: #fff;
        padding: 18px 24px;
    }

    .card-title-text {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .apple-header-back-btn {
        font-size: 13px !important;
        padding: 7px 16px !important;
        border-radius: 8px !important;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        background: rgba(255, 255, 255, 0.15) !important;
        color: #fff !important;
    }
    .apple-header-back-btn:hover { background: rgba(255, 255, 255, 0.3) !important; }

    .apple-card-body { padding: 24px; }

    /* ===== 工具栏（上传 / 批量通调） ===== */
    .premium-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: flex-end;
    }

    .premium-toolbar-group {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 10px;
    }

    .premium-toolbar-title {
        font-size: 13px;
        font-weight: 600;
        color: #86868b;
        margin-bottom: 8px;
        display: block;
    }

    .apple-input {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        height: 38px !important;
        box-shadow: none !important;
        transition: all 0.2s;
    }
    .apple-input:focus {
        border-color: #0071e3 !important;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15) !important;
    }

    .apple-btn-primary {
        background: #0071e3 !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 8px 18px !important;
        font-weight: 500 !important;
        color: #fff !important;
        height: 38px;
    }
    .apple-btn-primary:hover { background: #0077ed !important; }

    .apple-btn-purple {
        background: #5856D6 !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 8px 18px !important;
        font-weight: 500 !important;
        color: #fff !important;
        height: 38px;
    }
    .apple-btn-purple:hover { background: #6f6ee0 !important; }

    .apple-btn-default {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        background: #ffffff !important;
        color: #1d1d1f !important;
        padding: 8px 18px !important;
        height: 38px;
    }
    .apple-btn-default:hover { background: #f0f0f5 !important; border-color: #c7c7cc !important; }

    .premium-tpl-link { font-size: 12px; color: #0071e3; margin-left: 4px; }
    .premium-tpl-link:hover { text-decoration: underline; }

    /* ===== 表格样式 ===== */
    .apple-table-wrapper {
        border-radius: 12px;
        border: 1px solid #e5e5ea;
        overflow: hidden;
        background: #ffffff;
        width: 100%;
    }

    .apple-table {
        margin-bottom: 0 !important;
        background-color: #ffffff;
        width: 100%;
    }

    .apple-table th {
        background: #fafafc !important;
        color: #1d1d1f !important;
        font-weight: 600 !important;
        border-bottom: 1px solid #e5e5ea !important;
        padding: 14px 16px !important;
        white-space: nowrap;
    }

    .apple-table td {
        padding: 12px 16px !important;
        vertical-align: middle !important;
        border-color: #f0f0f2 !important;
        color: #1d1d1f;
    }

    .apple-table tbody tr:nth-of-type(odd) { background-color: #fbfbfd; }
    .apple-table tbody tr:hover { background-color: #f5f5f7; }

    .badge-number {
        font-weight: 600;
        color: #86868b;
        background: #f0f0f2;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
    }

    .premium-ratio-input {
        width: 120px;
        border-radius: 8px;
        border: 1px solid #d2d2d7;
        height: 34px;
        padding: 0 10px;
        text-align: center;
        font-weight: 600;
    }
    .premium-ratio-input:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        outline: none;
    }

    /* 通调预览：正值(上调)为红色，负值(下调)为绿色，加减号随行显示 */
    .premium-delta {
        display: inline-block;
        margin-left: 10px;
        font-size: 12px;
        font-weight: 600;
        min-width: 56px;
    }
    .premium-delta-up { color: #ff3b30; }
    .premium-delta-down { color: #34c759; }

    .apple-empty {
        text-align: center;
        color: #86868b;
        padding: 60px 0;
        font-size: 14px;
    }

    .premium-footer-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }

    .premium-footer-tip { font-size: 12px; color: #86868b; }

    @media (max-width: 768px) {
        .apple-backend-container { padding: 12px; }
        .apple-card-body { padding: 14px; }
        .premium-toolbar { gap: 16px; }
        .apple-table, .apple-table thead, .apple-table tbody, .apple-table tr, .apple-table td {
            display: block; width: 100% !important;
        }
        .apple-table thead { display: none; }
        .apple-table tbody tr {
            background: #ffffff !important;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 14px;
        }
        .apple-table tbody td {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 !important;
            border: none !important;
        }
        .apple-table tbody td::before {
            content: attr(data-label);
            font-weight: 600;
            color: #86868b;
            font-size: 13px;
        }
    }
</style>

<div class="container-fluid apple-backend-container">
    <section id="main-content">

        <div class="row apple-row">
            <div class="col-lg-12">
                <div class="apple-card">
                    <div class="card-header apple-card-header">
                        <span class="card-title-text">分类溢价管理 — {$info.name}</span>
                        <a class="btn btn-xs apple-header-back-btn" href="{:U('Goods/plate_infos','id='.$info['pid'])}">&larr; 返回板块分类条</a>
                    </div>
                    <div class="card-body apple-card-body">
                        <div class="premium-toolbar">

                            <div class="premium-toolbar-group">
                                <div>
                                    <span class="premium-toolbar-title">上传表格（覆盖当前分类溢价数据）</span>
                                    <input type="file" name="file" id="premiumFile" class="apple-input" style="display:inline-block;padding-top:6px;"/>
                                    <button type="button" class="btn apple-btn-primary" onclick="doImport()">上传导入</button>
                                    <a class="premium-tpl-link" href="/docs/common-temp.xlsx" target="_blank">下载导入模板</a>
                                </div>
                            </div>

                            <div class="premium-toolbar-group">
                                <div>
                                    <span class="premium-toolbar-title">批量通调（对全部规格按百分比调整，支持正负值）</span>
                                    <input type="number" step="0.001" id="adjustPercent" class="apple-input" style="width:120px;display:inline-block;" placeholder="如 5 或 -5"/>
                                    <span style="color:#86868b;">%</span>
                                    <button type="button" class="btn apple-btn-purple" onclick="applyAdjust()">应用调整</button>
                                    <button type="button" class="btn apple-btn-default" onclick="resetAdjust()">重置</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row apple-row">
            <div class="col-lg-12">
                <div class="apple-card">
                    <div class="card-header apple-card-header">
                        <span class="card-title-text">规格溢价倍率列表</span>
                    </div>
                    <div class="card-body apple-card-body">

                        <empty name="list">
                            <div class="apple-empty">暂无数据，请先在上方上传Excel表格导入分类溢价</div>
                        <else />
                        <form name="piont">
                            <div class="table-responsive apple-table-wrapper">
                                <table class="table table-hover apple-table">
                                    <thead>
                                        <tr>
                                            <th width="80">#</th>
                                            <th>产品规格</th>
                                            <th width="260">溢价倍率（支持修改，小数点后三位）</th>
                                            <th width="180">更新时间</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    <volist name="list" id="v">
                                        <tr>
                                            <td data-label="#"><span class="badge-number">{$v.id}</span></td>
                                            <td data-label="产品规格">{$v.spec}</td>
                                            <td data-label="溢价倍率">
                                                <input type="number" step="0.001" class="premium-ratio-input"
                                                       name="ratio[{$v.id}]" id="ratio_{$v.id}"
                                                       value="{$v.ratio}" data-base="{$v.ratio}"
                                                       oninput="clearDelta('{$v.id}')"/>
                                                <span class="premium-delta" id="delta_{$v.id}"></span>
                                            </td>
                                            <td data-label="更新时间">
                                                <span style="color:#86868b;font-size:13px;">
                                                    <if condition="$v['uptimes'] gt 0">{$v.uptimes|date='Y/m/d H:i:s',###}<else />--</if>
                                                </span>
                                            </td>
                                        </tr>
                                    </volist>
                                    </tbody>
                                </table>
                            </div>
                        </form>

                        <div class="premium-footer-bar">
                            <span class="premium-footer-tip">共 {$list|count} 条规格，修改数值或应用批量通调后，点击“保存修改”生效</span>
                            <button type="button" class="btn apple-btn-primary" onclick="saveAll()">保存修改</button>
                        </div>
                        </empty>

                    </div>
                </div>
            </div>
        </div>

    </section>
</div>

<script>

    var premiumPlateId = "{$id}";

    /**
     * 上传Excel导入（覆盖当前分类的溢价数据）
     */
    function doImport() {
        var fileEl = document.getElementById("premiumFile");
        if (!fileEl.files || !fileEl.files.length) {
            return swal("提示", "请先选择要上传的Excel文件", "warning");
        }
        layer.load(2);
        $.ajaxFileUpload({
            url: "{:U('Goods/premium_import')}",
            secureuri: false,
            fileElementId: "premiumFile",
            dataType: 'json',
            data: {pid: premiumPlateId},
            success: function (data) {
                layer.closeAll('loading');
                if (data.status !== 1) {
                    return swal("错误", data.msg, "error");
                }
                swal("成功", data.msg, "success");
                window.location.reload();
            },
            error: function () {
                layer.closeAll('loading');
                swal("错误", "上传失败，请检查表格格式", "error");
            }
        });
    }

    /**
     * 手动修改某一行数值后，清除该行的通调预览标记
     */
    function clearDelta(id) {
        $("#delta_" + id).text("").removeClass("premium-delta-up premium-delta-down");
    }

    /**
     * 批量通调：以当前表格内数值为基准，按百分比整体调增/调减
     * 正值(调增)显示红色，负值(调减)显示绿色，加减号随数值显示
     */
    function applyAdjust() {
        var percent = parseFloat($("#adjustPercent").val());
        if (isNaN(percent)) {
            return swal("提示", "请输入调整百分比，例如 5 或 -5", "warning");
        }
        $("input.premium-ratio-input").each(function () {
            var $input = $(this);
            var id = $input.attr("id").replace("ratio_", "");
            var base = parseFloat($input.val());
            if (isNaN(base)) return;
            var next = Math.round(base * (1 + percent / 100) * 1000) / 1000;
            var delta = Math.round((next - base) * 1000) / 1000;
            $input.val(next.toFixed(3));
            var $delta = $("#delta_" + id);
            if (delta > 0) {
                $delta.text("+" + delta.toFixed(3)).removeClass("premium-delta-down").addClass("premium-delta-up");
            } else if (delta < 0) {
                $delta.text(delta.toFixed(3)).removeClass("premium-delta-up").addClass("premium-delta-down");
            } else {
                $delta.text("").removeClass("premium-delta-up premium-delta-down");
            }
        });
    }

    /**
     * 重置：还原为本次进入页面时加载的原始溢价倍率，并清空通调百分比与预览
     */
    function resetAdjust() {
        $("input.premium-ratio-input").each(function () {
            var $input = $(this);
            var id = $input.attr("id").replace("ratio_", "");
            $input.val($input.data("base"));
            $("#delta_" + id).text("").removeClass("premium-delta-up premium-delta-down");
        });
        $("#adjustPercent").val("");
    }

    /**
     * 保存修改（单条修改 / 批量通调后的结果统一保存）
     */
    function saveAll() {
        var temp = $("form[name='piont']").serializeArray();
        var data = objToArray(temp);
        layer.load(2);
        $.ajax({
            url: "{:U('Goods/premium_save')}",
            type: "post",
            dataType: "json",
            data: data,
            success: function (res) {
                layer.closeAll('loading');
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                swal("成功", res.msg, "success");
                window.location.reload();
            },
            error: function () {
                layer.closeAll('loading');
                swal("错误", "保存失败，请稍后重试", "error");
            }
        });
    }

</script>
