<style>
    /* ===== 苹果极简商务风：全局容器与排版样式 ===== */
    .apple-backend-container {
        background-color: #f5f5f7;
        padding: 20px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1d1d1f;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
    }

    .apple-row {
        margin-bottom: 0;
        width: 100%;
    }

    /* ===== 苹果高档质感卡片 ===== */
    .apple-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.04);
        margin-bottom: 0;
        overflow: hidden;
        transition: all 0.3s ease;
        width: 100%;
    }

    .apple-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2c3e50;
        color: #fff;
        padding: 16px 20px;
        border-bottom: none;
    }

    .card-title-text {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .apple-header-add-btn {
        font-size: 12px !important;
        padding: 6px 14px !important;
        height: auto !important;
        border-radius: 6px !important;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        background: rgba(255, 255, 255, 0.15) !important;
        color: #fff !important;
        transition: all 0.2s ease;
    }
    .apple-header-add-btn:hover {
        background: rgba(255, 255, 255, 0.3) !important;
    }

    .apple-card-body {
        padding: 20px;
    }

    /* ===== 表格样式优化 ===== */
    .apple-table-wrapper {
        border-radius: 12px;
        border: 1px solid #e5e5ea;
        overflow: hidden;
    }

    .apple-table {
        margin-bottom: 0 !important;
        background-color: #ffffff;
        width: 100%;
    }

    .apple-table th {
        background: #fafafc !important;
        color: #1d1d1f !important;
        font-weight: 600 !important;
        border-bottom: 1px solid #e5e5ea !important;
        padding: 14px 16px !important;
    }

    .apple-table td {
        padding: 14px 16px !important;
        vertical-align: middle !important;
        border-color: #f0f0f2 !important;
        color: #1d1d1f;
    }

    .apple-table tbody tr:nth-of-type(odd) {
        background-color: #fbfbfd;
    }

    .apple-table tbody tr:hover {
        background-color: #f5f5f7;
    }

    .badge-number {
        font-weight: 600;
        color: #86868b;
        background: #f0f0f2;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
    }

    .text-bold-name {
        font-weight: 600;
        color: #1d1d1f;
    }

    .status-badge-normal {
        background: #eef6ed;
        color: #34c759;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
    }

    .status-badge-pause {
        background: #fdf2f2;
        color: #ff3b30;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
    }

    .table-action-group {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
    }

    .apple-btn-edit {
        background-color: #0071e3 !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 5px 12px !important;
        font-weight: 500 !important;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .apple-btn-edit:hover {
        background-color: #0077ed !important;
    }

    .apple-btn-del {
        background-color: #ff3b30 !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 5px 12px !important;
        font-weight: 500 !important;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .apple-btn-del:hover {
        background-color: #e0342b !important;
    }

    .apple-pagination-box {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
    }

    /* ===== 弹窗精细化控制 ===== */
    .apple-modal .modal-dialog {
        max-width: 520px;
        margin: 40px auto;
    }

    .apple-modal .modal-content {
        border-radius: 16px;
        border: none;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        background: #ffffff;
        overflow: hidden;
    }

    .apple-modal .modal-header {
        background: #fafafc;
        border-bottom: 1px solid #e5e5ea;
        padding: 16px 20px;
    }

    .apple-modal .modal-title {
        font-weight: 600;
        color: #1d1d1f;
        font-size: 16px;
    }

    .apple-modal .modal-body {
        padding: 24px 20px;
    }

    .apple-modal .form-group {
        margin-bottom: 16px;
    }

    .apple-modal .form-group label {
        font-weight: 600;
        color: #1d1d1f;
        font-size: 13px;
        margin-bottom: 6px;
        display: block;
    }

    .apple-input {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        height: 40px !important;
        box-shadow: none !important;
        transition: all 0.2s;
    }
    .apple-input:focus {
        border-color: #0071e3 !important;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15) !important;
    }

    .apple-modal .modal-footer {
        background: #fafafc;
        border-top: 1px solid #e5e5ea;
        padding: 12px 20px;
        display: flex !important;
        align-items: center;
        justify-content: flex-end !important;
        gap: 10px;
    }

    .apple-btn-primary {
        background: #0071e3 !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 8px 18px !important;
        font-weight: 500 !important;
        color: #fff !important;
        height: 38px;
    }
    .apple-btn-primary:hover {
        background: #0077ed !important;
    }

    .apple-btn-default {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        background: #ffffff !important;
        color: #1d1d1f !important;
        padding: 8px 18px !important;
        height: 38px;
    }
    .apple-btn-default:hover {
        background: #f0f0f5 !important;
        border-color: #c7c7cc !important;
    }

    /* ==========================================
       移动端响应式降级：转为高档卡片式布局
       ========================================== */
    @media (max-width: 768px) {
        .apple-backend-container {
            padding: 12px;
        }

        .apple-card-body {
            padding: 12px;
        }

        .apple-table, .apple-table thead, .apple-table tbody, .apple-table tr, .apple-table td {
            display: block;
            width: 100%;
        }

        .apple-table thead {
            display: none;
        }

        .apple-table tbody tr {
            background: #ffffff !important;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .apple-table tbody td {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 !important;
            border: none !important;
            text-align: right;
        }

        .apple-table tbody td::before {
            content: attr(data-label);
            font-weight: 600;
            color: #86868b;
            text-align: left;
            font-size: 13px;
        }

        .table-action-group {
            justify-content: flex-end;
            width: 100%;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f2;
        }

        .apple-btn-edit, .apple-btn-del {
            padding: 8px 16px !important;
            height: 40px !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .apple-modal .modal-dialog {
            width: 90% !important;
            margin: 20px auto !important;
        }
    }
</style>

<div class="container-fluid apple-backend-container" ng-app="myApp" ng-controller="myCtrl">
    <!-- 主体内容区 -->
    <section id="main-content">
        <div class="row apple-row">
            <div class="col-lg-12">
                <div class="apple-card">
                    <div class="card-header apple-card-header">
                        <span class="card-title-text">商品分类列表</span>
                        <div class="card-header-right-icon">
                            <a class="btn btn-xs apple-header-add-btn" data-toggle="modal" data-target="#myModal">+ 添加商品分类</a>
                        </div>
                    </div>
                    <div class="card-body apple-card-body">
                        <div class="table-responsive apple-table-wrapper">
                            <table class="table table-hover apple-table">
                                <thead>
                                    <tr>
                                        <th width="80">#序号</th>
                                        <th>分类名称</th>
                                        <th>排序</th>
                                        <th>状态</th>
                                        <th width="180">记录时间</th>
                                        <th width="150" class="text-right">管理操作</th>
                                    </tr>
                                </thead>
                                <tbody>

                                <volist name="list.list" id="v">
                                    <tr>
                                        <td data-label="序号">
                                            <span class="badge-number">{$v.id}</span>
                                        </td>
                                        <td data-label="分类名称">
                                            <span class="text-bold-name">{$v.name}</span>
                                        </td>
                                        <td data-label="排序">
                                            <span class="badge-number">{$v.sort}</span>
                                        </td>
                                        <td data-label="状态">
                                            <if condition="$v['status'] gt 0">
                                                <span class="status-badge-normal">正常</span>
                                            <else />
                                                <span class="status-badge-pause">暂停使用</span>
                                            </if>
                                        </td>
                                        <td data-label="记录时间">
                                            <span style="color: #86868b; font-size: 13px;">{$v.times|date='Y/m/d H:i:s',###}</span>
                                        </td>
                                        <td data-label="管理操作" class="text-right">
                                            <div class="table-action-group">
                                                <a ng-click="updateinfo('{$v.id}')" class="btn btn-info btn-xs apple-btn-edit">编辑</a>
                                                <a class="btn btn-danger btn-xs apple-btn-del" ng-click="dels('{$v.id}')">删除</a>
                                            </div>
                                        </td>
                                    </tr>
                                </volist>

                                </tbody>
                            </table>

                            <div class="apple-pagination-box">
                                <nav aria-label="Page navigation">
                                    <ul class="pagination">{$list.show}</ul>
                                </nav>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade apple-modal" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">添加商品分类</h4>
                </div>
                <div class="modal-body">

                    <form name="ador">
                        <div class="form-group">
                            <label>分类名称</label>
                            <input type="text" name="name" class="form-control apple-input" placeholder="请输入分类名称"/>
                        </div>
                        <div class="form-group">
                            <label>分类排序</label>
                            <input type="number" name="sort" class="form-control apple-input" value="0"/>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control apple-input">
                                <option value="1">使用</option>
                                <option value="0">暂停</option>
                            </select>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default apple-btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary apple-btn-primary" onclick="addor()">确认添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade apple-modal" id="myEdit" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">更新商品分类</h4>
                </div>
                <div class="modal-body">

                    <form>
                        <div class="form-group">
                            <label>分类名称</label>
                            <input type="text" name="name" class="form-control apple-input" ng-model="infos.name"/>
                        </div>
                        <div class="form-group">
                            <label>分类排序</label>
                            <input type="text" name="sort" class="form-control apple-input" ng-model="infos.sort"/>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control apple-input" ng-model="infos.status">
                                <option value="1">使用</option>
                                <option value="0">暂停</option>
                            </select>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default apple-btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary apple-btn-primary" ng-click="updateCats()">确认更新</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    /**
     * 添加
     * @returns {undefined}
     */
    function addor() {
        var temp = $("form[name='ador']").serializeArray();
        var data = objToArray(temp);
        var baseurl = "{:U('Core/addon','model=plate_cats')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

    /**
     * 同步分类信息
     * @returns {undefined}
     */
    function syncs() {
        var temp = $("form[name='piont']").serializeArray();
        var data = objToArray(temp);
        //////
        layer.load(2);
        $.ajax({
            url: "{:U('Goods/cats_sync')}",
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                layer.closeAll();
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {
                layer.closeAll();
                return swal('提示', "修改失败，请检查分类基础参数是否正确", "error");
            },
        });
    }

    var app = angular.module('myApp', []);
    app.controller('myCtrl', function ($scope, $http) {

        $scope.infos;

        ////////////////////////////////////////////////////////////////////////

        /**
         * 通讯操作
         * @param {type} url
         * @param {type} data
         * @returns {undefined}
         */
        $scope.commAjax = function (url, data, success) {
            $http({
                method: "POST",
                url: url,
                data: data,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                transformRequest: function (obj) {
                    var str = [];
                    for (var p in obj) {
                        str.push(encodeURIComponent(p) + "=" + encodeURIComponent(obj[p]));
                    }
                    return str.join("&");
                }
            }).success(function (response) {
                success(response);
            });
        };

        ////////////////////////////////////////////////////////////////////////

        $scope.updateinfo = function (id) {
            $scope.commAjax("{:U('Core/infos','model=plate_cats')}", {ids: id}, function (res) {
                $scope.infos = res.data;
                $("#myEdit").modal("show");
            });
        }

        $scope.updateCats = function () {
            var param = $scope.infos;
            param.ids = param.id;
            /////////
            $.ajax({
                url: "{:U('Goods/cats_edit')}",
                type: "post",
                dataType: 'json',
                data: param,
                success: function (data) {
                    if (data.status !== 1) {
                        return swal("错误", data.msg, "error");
                    }
                    window.location.reload();
                },
                error: function (data) {
                    console.log(data);
                }
            });
        }

        $scope.dels = function (ids) {
            var param = {id: ids};
            $scope.commAjax("{:U('Core/dels','model=plate_cats')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

    });
</script>
