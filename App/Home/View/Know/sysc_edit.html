<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>修改系统文本 - 易缆通商城后台</title>

    <script charset="utf-8" src="__PUBLIC__/libs/kindeditor/kindeditor-all.js"></script>
    <script charset="utf-8" src="__PUBLIC__/libs/kindeditor/lang/zh-CN.js"></script>

    <!-- 苹果极简商务风与响应式全局样式 -->
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card-bg: #ffffff;
            --apple-text-main: #1d1d1f;
            --apple-text-sub: #86868b;
            --apple-border: #d2d2d7;
            --apple-primary: #0071e3;
            --apple-primary-hover: #0077ed;
            --apple-danger: #ff3b30;
            --apple-radius: 12px;
            --apple-radius-sm: 8px;
            --apple-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --apple-transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 电脑端全屏无极铺开，边缘微缝，绝无横向滚动条 */
        .container-fluid {
            width: 100% !important;
            max-width: 100% !important;
            padding: 24px 32px !important;
            margin: 0 !important;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -12px;
            margin-left: -12px;
        }

        .col-lg-8, .col-lg-4, .col-lg-12, .col-md-12 {
            position: relative;
            width: 100%;
            padding-right: 12px;
            padding-left: 12px;
        }

        @media (min-width: 992px) {
            .col-lg-8 { flex: 0 0 66.66667%; max-width: 66.66667%; }
            .col-lg-4 { flex: 0 0 33.33333%; max-width: 33.33333%; }
            .col-lg-12 { flex: 0 0 100%; max-width: 100%; }
        }

        @media (min-width: 768px) {
            .col-md-12 { flex: 0 0 100%; max-width: 100%; }
        }

        /* 顶部标题与面包屑 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 16px;
        }

        .page-title h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--apple-text-main);
            letter-spacing: -0.5px;
        }

        .breadcrumb {
            display: flex;
            list-style: none;
            background: transparent;
            padding: 0;
            margin: 0;
            font-size: 13px;
            color: var(--apple-text-sub);
        }

        .breadcrumb li + li:before {
            content: "/";
            padding: 0 8px;
            color: var(--apple-border);
        }

        .breadcrumb a {
            color: var(--apple-primary);
            text-decoration: none;
        }

        /* 苹果高档卡片质感 */
        .card {
            background-color: var(--apple-card-bg);
            border-radius: var(--apple-radius);
            box-shadow: var(--apple-shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background-color: rgba(255, 255, 255, 0.8);
        }

        .card-header h4 {
            font-size: 17px;
            font-weight: 600;
            color: var(--apple-text-main);
        }

        .card-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
            color: var(--apple-text-sub);
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 10px 16px;
            font-size: 15px;
            line-height: 1.5;
            color: var(--apple-text-main);
            background-color: #ffffff;
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-sm);
            transition: var(--apple-transition);
        }

        .form-control:focus {
            border-color: var(--apple-primary);
            outline: 0;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        /* 按钮美化与触控优化 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            user-select: none;
            border: 1px solid transparent;
            padding: 12px 28px;
            font-size: 15px;
            border-radius: var(--apple-radius-sm);
            transition: var(--apple-transition);
            cursor: pointer;
            text-decoration: none;
            min-height: 44px;
        }

        .btn-primary {
            background-color: var(--apple-primary);
            color: #fff;
            border-color: var(--apple-primary);
        }

        .btn-primary:hover {
            background-color: var(--apple-primary-hover);
        }

        /* KindEditor 编辑器多端自适应样式 */
        .ke-container {
            height: auto !important;
            width: 100% !important;
            border-radius: var(--apple-radius-sm) !important;
            border-color: var(--apple-border) !important;
            box-sizing: border-box !important;
        }

        .ke-edit {
            width: 100% !important;
        }

        .ke-toolbar {
            background-color: #f8fafc !important;
            border-bottom: 1px solid var(--apple-border) !important;
        }

        /* 移动端响应式极致适配 */
        @media (max-width: 768px) {
            .container-fluid {
                padding: 12px 16px !important;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .breadcrumb {
                display: none;
            }

            .btn-primary {
                width: 100%;
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>修改系统文本</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <ol class="breadcrumb text-right">
                        <li><a href="{:U('Know/sysc')}">系统文本</a></li>
                        <li class="active">修改系统文本</li>
                    </ol>
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">
        <div class="row">
            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>修改 {$info.name}</h4>
                    </div>
                    <div class="card-body">
                        <form>
                            <input type="hidden" name="ids" value="{$info.id}"/>

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label>文本内容详情</label>
                                        <textarea name="context" id="editor_id" class="form-control" rows="25" style="height: 500px; width: 100%;">{$info.context|htmlspecialchars_decode}</textarea>
                                    </div>
                                    <button type="button" class="btn btn-primary" onclick="addor()">保存修改</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    KindEditor.ready(function (K) {
        window.editor = K.create('#editor_id', {
            width: '100%',
            height: '500px',
            resizeType: 1
        });
    });

    function objToArray(arr) {
        var obj = {};
        for (var i = 0; i < arr.length; i++) {
            obj[arr[i].name] = arr[i].value;
        }
        return obj;
    }

    /**
     * 修改提交
     * @returns {undefined}
     */
    function addor() {
        if (window.editor) {
            window.editor.sync();
        }
        var temp = $("form").serializeArray();
        var data = objToArray(temp);
        var baseurl = "{:U('Core/edits','model=sys_article')}";
        
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {
                alert('网络请求异常，请稍后再试');
            },
        });
    }
</script>

</body>
</html>
