<script charset="utf-8" src="__PUBLIC__/libs/kindeditor/kindeditor-all.js"></script>
<script charset="utf-8" src="__PUBLIC__/libs/kindeditor/lang/zh-CN.js"></script>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>修改系统文本</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <ol class="breadcrumb text-right">
                        <li><a href="{:U('Know/sysc')}">系统文本</a></li>
                        <li class="active">修改系统文本</li>
                    </ol>
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">
        <div class="row">
            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>修改{$info.name}</h4>
                    </div>
                    <div class="card-body">
                        <form>
                            <input type="hidden" name="ids" value="{$info.id}"/>

                            <div class="row">
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label>内容</label>
                                        <textarea name="context" id="editor_id" class="form-control input-sm" rows="25">{$info.context|htmlspecialchars_decode}</textarea>
                                    </div>
                                    <button type="button" class="btn btn-primary" onclick="addor()">修改</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>

    KindEditor.ready(function (K) {
        window.editor = K.create('#editor_id');
    });

    /**
     * 修改
     * @returns {undefined}
     */
    function addor() {
        editor.sync();
        ////
        var temp = $("form").serializeArray();
        var data = objToArray(temp);
        var baseurl = "{:U('Core/edits','model=sys_article')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

</script>
