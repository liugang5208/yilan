<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>系统文本列表 - 易缆通商城后台</title>

    <!-- 苹果极简商务风与响应式全局样式 -->
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card-bg: #ffffff;
            --apple-text-main: #1d1d1f;
            --apple-text-sub: #86868b;
            --apple-border: #d2d2d7;
            --apple-primary: #0071e3;
            --apple-primary-hover: #0077ed;
            --apple-danger: #ff3b30;
            --apple-radius: 12px;
            --apple-radius-sm: 8px;
            --apple-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --apple-transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 电脑端超宽带鱼屏全屏无极铺开，边缘留出微小舒适缝隙，绝无左右横向滚动条 */
        .container-fluid {
            width: 100% !important;
            max-width: 100% !important;
            padding: 24px 32px !important;
            margin: 0 !important;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -12px;
            margin-left: -12px;
        }

        .col-lg-8, .col-lg-4, .col-lg-12 {
            position: relative;
            width: 100%;
            padding-right: 12px;
            padding-left: 12px;
        }

        @media (min-width: 992px) {
            .col-lg-8 { flex: 0 0 66.66667%; max-width: 66.66667%; }
            .col-lg-4 { flex: 0 0 33.33333%; max-width: 33.33333%; }
            .col-lg-12 { flex: 0 0 100%; max-width: 100%; }
        }

        /* 顶部标题与面包屑 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 16px;
        }

        .page-title h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--apple-text-main);
            letter-spacing: -0.5px;
        }

        /* 苹果高档半透明质感卡片 */
        .card {
            background-color: var(--apple-card-bg);
            border-radius: var(--apple-radius);
            box-shadow: var(--apple-shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background-color: rgba(255, 255, 255, 0.8);
        }

        .card-header h4 {
            font-size: 17px;
            font-weight: 600;
            color: var(--apple-text-main);
        }

        .card-body {
            padding: 24px;
        }

        /* 按钮与交互规范 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            user-select: none;
            border: 1px solid transparent;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: var(--apple-radius-sm);
            transition: var(--apple-transition);
            cursor: pointer;
            text-decoration: none;
        }

        .btn-info {
            background-color: var(--apple-primary);
            color: #ffffff;
            border-color: var(--apple-primary);
        }

        .btn-info:hover {
            background-color: var(--apple-primary-hover);
        }

        .btn-xs {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
        }

        /* 电脑端大表格样式 */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table th, .table td {
            padding: 16px 20px;
            font-size: 14px;
            color: var(--apple-text-main);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .table th {
            font-weight: 600;
            color: var(--apple-text-sub);
            background-color: rgba(0, 0, 0, 0.01);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 奇偶行交叉底色，辨识度极高 */
        .table tbody tr:nth-child(odd) {
            background-color: rgba(245, 245, 247, 0.5);
        }

        .table tbody tr:hover {
            background-color: rgba(0, 113, 227, 0.02);
        }

        /* 手机端卡片流式容器（默认隐藏，小屏幕下自动启用） */
        .mobile-card-list {
            display: none;
        }

        /* 分页器样式 */
        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 24px 0 0 0;
            gap: 6px;
            justify-content: flex-end;
        }

        .pagination li a, .pagination li span {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 12px;
            font-size: 14px;
            border-radius: var(--apple-radius-sm);
            background-color: #ffffff;
            border: 1px solid var(--apple-border);
            color: var(--apple-text-main);
            text-decoration: none;
            transition: var(--apple-transition);
        }

        .pagination li.active span {
            background-color: var(--apple-primary);
            border-color: var(--apple-primary);
            color: #ffffff;
        }

        .pagination li a:hover {
            background-color: rgba(0, 113, 227, 0.05);
            border-color: var(--apple-primary);
            color: var(--apple-primary);
        }

        /* ==================== 手机端响应式卡片折叠与触控防误触 ==================== */
        @media (max-width: 768px) {
            .container-fluid {
                padding: 12px 16px !important;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            /* 隐藏传统横向大表格，防止手机端挤压变形 */
            .table-responsive {
                display: none;
            }

            /* 启用手机端纵向独立卡片折叠布局 */
            .mobile-card-list {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .m-card-item {
                background: #ffffff;
                border-radius: var(--apple-radius);
                padding: 16px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
                border: 1px solid rgba(0, 0, 0, 0.04);
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .m-card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid rgba(0, 0, 0, 0.04);
                padding-bottom: 10px;
            }

            .m-card-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--apple-text-main);
            }

            .m-card-id {
                font-size: 12px;
                color: var(--apple-text-sub);
                background: rgba(0, 0, 0, 0.04);
                padding: 2px 8px;
                border-radius: 4px;
            }

            .m-card-body {
                display: flex;
                flex-direction: column;
                gap: 8px;
                font-size: 14px;
            }

            .m-card-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .m-card-label {
                color: var(--apple-text-sub);
                font-size: 13px;
            }

            .m-card-value {
                color: var(--apple-text-main);
                font-weight: 500;
            }

            .m-card-footer {
                display: flex;
                gap: 12px;
                padding-top: 10px;
                border-top: 1px solid rgba(0, 0, 0, 0.04);
            }

            .m-card-footer .btn {
                flex: 1;
                height: 44px;
                font-size: 14px;
                border-radius: var(--apple-radius-sm);
            }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>系统文本列表</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <!--ol class="breadcrumb text-right">
                        <li><a href="#">Dashboard</a></li>
                        <li class="active">UI-Blank</li>
                    </ol-->
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">

        <div class="row">

            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>系统文本列表</h4>
                    </div>
                    <div class="card-body">
                        <!-- 电脑端常规大表格 -->
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>文本分类</th>
                                        <th width="10%">管理</th>
                                    </tr>
                                </thead>
                                <tbody>

                                <volist name="list.list" id="v">
                                    <tr>
                                        <th scope="row">{$v.id}</th>
                                        <td><strong>{$v.name}</strong></td>
                                        <td>
                                            <a href="{:U('Know/sysc_edit','id='.$v['id'])}" class="btn btn-info btn-xs">修改</a>
                                        </td>
                                    </tr>
                                </volist>

                                </tbody>
                            </table>
                        </div>

                        <!-- 手机端独立卡片式折叠降级布局 -->
                        <div class="mobile-card-list">
                            <volist name="list.list" id="v">
                                <div class="m-card-item">
                                    <div class="m-card-header">
                                        <span class="m-card-title">{$v.name}</span>
                                        <span class="m-card-id">ID: {$v.id}</span>
                                    </div>
                                    <div class="m-card-body">
                                        <div class="m-card-row">
                                            <span class="m-card-label">文本分类名称</span>
                                            <span class="m-card-value">{$v.name}</span>
                                        </div>
                                    </div>
                                    <div class="m-card-footer">
                                        <a href="{:U('Know/sysc_edit','id='.$v['id'])}" class="btn btn-info">修改</a>
                                    </div>
                                </div>
                            </volist>
                        </div>

                        <nav aria-label="Page navigation">
                            <ul class="pagination">{$list.show}</ul>
                        </nav>

                    </div>
                </div>
            </div>

        </div>
    </section>
</div>

</body>
</html>
