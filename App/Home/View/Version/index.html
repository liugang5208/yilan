<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>APP版本管理 - 易缆通商城后台</title>

    <!-- 苹果极简商务风与响应式全局样式 -->
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card-bg: #ffffff;
            --apple-text-main: #1d1d1f;
            --apple-text-sub: #86868b;
            --apple-border: #d2d2d7;
            --apple-primary: #0071e3;
            --apple-primary-hover: #0077ed;
            --apple-danger: #ff3b30;
            --apple-radius: 12px;
            --apple-radius-sm: 8px;
            --apple-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --apple-transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 电脑端超宽带鱼屏全屏无极铺开，边缘微缝，绝无横向滚动条 */
        .container-fluid {
            width: 100% !important;
            max-width: 100% !important;
            padding: 24px 32px !important;
            margin: 0 !important;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -12px;
            margin-left: -12px;
        }

        .col-lg-8, .col-lg-4, .col-lg-12, .col-md-6 {
            position: relative;
            width: 100%;
            padding-right: 12px;
            padding-left: 12px;
        }

        @media (min-width: 992px) {
            .col-lg-8 { flex: 0 0 66.66667%; max-width: 66.66667%; }
            .col-lg-4 { flex: 0 0 33.33333%; max-width: 33.33333%; }
            .col-lg-12 { flex: 0 0 100%; max-width: 100%; }
        }

        @media (min-width: 768px) {
            .col-md-6 { flex: 0 0 50%; max-width: 50%; }
        }

        /* 顶部标题与面包屑 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 16px;
        }

        .page-title h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--apple-text-main);
            letter-spacing: -0.5px;
        }

        /* 苹果高档半透明质感卡片 */
        .card {
            background-color: var(--apple-card-bg);
            border-radius: var(--apple-radius);
            box-shadow: var(--apple-shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background-color: rgba(255, 255, 255, 0.8);
        }

        .card-header h4 {
            font-size: 17px;
            font-weight: 600;
            color: var(--apple-text-main);
        }

        .card-body {
            padding: 24px;
        }

        /* 按钮与交互规范 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            user-select: none;
            border: 1px solid transparent;
            padding: 8px 18px;
            font-size: 14px;
            border-radius: var(--apple-radius-sm);
            transition: var(--apple-transition);
            cursor: pointer;
            text-decoration: none;
        }

        .btn-info {
            background-color: var(--apple-primary);
            color: #ffffff;
            border-color: var(--apple-primary);
        }

        .btn-info:hover {
            background-color: var(--apple-primary-hover);
        }

        .btn-default {
            background-color: #e5e5ea;
            color: var(--apple-text-main);
            border-color: #e5e5ea;
        }

        .btn-default:hover {
            background-color: #d1d1d6;
        }

        .btn-primary {
            background-color: var(--apple-primary);
            color: #ffffff;
            border-color: var(--apple-primary);
        }

        .btn-primary:hover {
            background-color: var(--apple-primary-hover);
        }

        .btn-xs {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
        }

        /* 电脑端大表格样式 */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table th, .table td {
            padding: 16px 18px;
            font-size: 14px;
            color: var(--apple-text-main);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            vertical-align: middle;
        }

        .table th {
            font-weight: 600;
            color: var(--apple-text-sub);
            background-color: rgba(0, 0, 0, 0.01);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 奇偶行交叉底色，让辨识度更高 */
        .table tbody tr:nth-child(odd) {
            background-color: rgba(245, 245, 247, 0.5);
        }

        .table tbody tr:hover {
            background-color: rgba(0, 113, 227, 0.02);
        }

        /* 表单控件优化 */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--apple-text-sub);
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--apple-text-main);
            background-color: #ffffff;
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-sm);
            transition: var(--apple-transition);
        }

        .form-control:focus {
            border-color: var(--apple-primary);
            outline: 0;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        /* 手机端独立卡片流式容器（默认隐藏，小屏幕下自动启用） */
        .mobile-card-list {
            display: none;
        }

        /* 弹窗毛玻璃与圆角升级 */
        .modal-dialog {
            width: 90% !important;
            max-width: 600px !important;
            margin: 30px auto !important;
        }

        .modal-content {
            border: none;
            border-radius: var(--apple-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
            overflow: hidden;
        }

        .modal-header {
            background-color: rgba(245, 245, 247, 0.8);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-weight: 600;
            font-size: 17px;
            color: var(--apple-text-main);
            margin: 0;
        }

        .modal-header .close {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--apple-text-sub);
            cursor: pointer;
        }

        .modal-body {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-footer {
            background-color: rgba(245, 245, 247, 0.5);
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 分页器样式 */
        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 24px 0 0 0;
            gap: 6px;
            justify-content: flex-end;
        }

        .pagination li a, .pagination li span {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 12px;
            font-size: 14px;
            border-radius: var(--apple-radius-sm);
            background-color: #ffffff;
            border: 1px solid var(--apple-border);
            color: var(--apple-text-main);
            text-decoration: none;
            transition: var(--apple-transition);
        }

        .pagination li.active span {
            background-color: var(--apple-primary);
            border-color: var(--apple-primary);
            color: #ffffff;
        }

        .pagination li a:hover {
            background-color: rgba(0, 113, 227, 0.05);
            border-color: var(--apple-primary);
            color: var(--apple-primary);
        }

        /* ==================== 手机端响应式卡片折叠与触控防误触 ==================== */
        @media (max-width: 768px) {
            .container-fluid {
                padding: 12px 16px !important;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            /* 隐藏传统横向大表格，防止手机端挤压变形 */
            .table-responsive {
                display: none;
            }

            /* 启用手机端纵向独立卡片折叠布局 */
            .mobile-card-list {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .m-card-item {
                background: #ffffff;
                border-radius: var(--apple-radius);
                padding: 16px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
                border: 1px solid rgba(0, 0, 0, 0.04);
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .m-card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid rgba(0, 0, 0, 0.04);
                padding-bottom: 10px;
            }

            .m-card-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--apple-text-main);
            }

            .m-card-id {
                font-size: 12px;
                color: var(--apple-text-sub);
                background: rgba(0, 0, 0, 0.04);
                padding: 2px 8px;
                border-radius: 4px;
            }

            .m-card-body {
                display: flex;
                flex-direction: column;
                gap: 8px;
                font-size: 14px;
            }

            .m-card-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .m-card-label {
                color: var(--apple-text-sub);
                font-size: 13px;
            }

            .m-card-value {
                color: var(--apple-text-main);
                font-weight: 500;
                text-align: right;
                word-break: break-all;
            }

            .m-card-footer {
                display: flex;
                gap: 12px;
                padding-top: 10px;
                border-top: 1px solid rgba(0, 0, 0, 0.04);
            }

            .m-card-footer .btn {
                flex: 1;
                height: 44px;
                font-size: 14px;
                border-radius: var(--apple-radius-sm);
            }

            .modal-dialog {
                width: 95% !important;
                margin: 10px auto !important;
            }
        }
    </style>
</head>
<body ng-app="myApp" ng-controller="myCtrl">

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>APP版本管理</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <!--ol class="breadcrumb text-right">
                        <li><a href="#">Dashboard</a></li>
                        <li class="active">UI-Blank</li>
                    </ol-->
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">

        <div class="row">
            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>版本信息列表</h4>
                        <div class="card-header-right-icon">
                            <ul>
                                <li class="doc-link" style="list-style: none;">
                                    <a class="btn btn-xs btn-info" data-toggle="modal" data-target="#myModal">添加版本</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- 电脑端常规大表格 -->
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>类型</th>
                                        <th>版本号</th>
                                        <th>版本序列号</th>
                                        <th>下载链接</th>
                                        <th width="10%">管理</th>
                                    </tr>
                                </thead>
                                <tbody>

                                <volist name="list.list" id="v">
                                    <tr>
                                        <th scope="row">{$v.id}</th>
                                        <td><strong>{$v['system_title']}</strong></td>
                                        <td><span style="color: var(--apple-primary); font-weight: 600;">{$v['version']}</span></td>
                                        <td><code>{$v['version_sort']}</code></td>
                                        <td><a href="{$v['url']}" target="_blank" style="color: var(--apple-primary); text-decoration: none;">{$v['url']}</a></td>
                                        <td>
                                            <a ng-click="updateinfo('{$v.id}')" class="btn btn-info btn-xs">编辑</a>
                                        </td>
                                    </tr>
                                </volist>

                                </tbody>
                            </table>
                        </div>

                        <!-- 手机端独立卡片式折叠降级布局（确保信息零丢失，排版井然有序） -->
                        <div class="mobile-card-list">
                            <volist name="list.list" id="v">
                                <div class="m-card-item">
                                    <div class="m-card-header">
                                        <span class="m-card-title">版本号: {$v['version']}</span>
                                        <span class="m-card-id">ID: {$v.id}</span>
                                    </div>
                                    <div class="m-card-body">
                                        <div class="m-card-row">
                                            <span class="m-card-label">系统类型</span>
                                            <span class="m-card-value"><strong>{$v['system_title']}</strong></span>
                                        </div>
                                        <div class="m-card-row">
                                            <span class="m-card-label">版本序列号</span>
                                            <span class="m-card-value"><code>{$v['version_sort']}</code></span>
                                        </div>
                                        <div class="m-card-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                                            <span class="m-card-label">下载链接</span>
                                            <span class="m-card-value" style="text-align: left; word-break: break-all; color: var(--apple-primary);">{$v['url']}</span>
                                        </div>
                                    </div>
                                    <div class="m-card-footer">
                                        <a class="btn btn-info" ng-click="updateinfo('{$v.id}')">编辑版本</a>
                                    </div>
                                </div>
                            </volist>
                        </div>

                        <nav aria-label="Page navigation" style="text-align: right;">
                            <ul class="pagination">{$list.show}</ul>
                        </nav>

                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="myModalLabel">添加版本信息</h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">

                    <form name="ador">
                        <div class="form-group">
                            <label>类型</label>
                            <select name="system" class="form-control">
                                <option value="1">安卓</option>
                                <option value="2">ios</option>
                            </select>
                        </div>
                         <div class="form-group">
                            <label>版本号</label>
                            <input type="text" name="version" class="form-control" placeholder="请输入版本号，例如 1.0.0"/>
                        </div>
                        
                        <div class="form-group">
                            <label>版本序列号 (最新序列号一定要比之前大)</label>
                            <input type="text" name="version_sort" class="form-control" placeholder="请输入数字序列号"/>
                        </div>
                         <div class="form-group">
                            <label>下载链接</label>
                            <input type="text" name="url" class="form-control" placeholder="请输入完整的下载链接地址"/>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addor()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="myEdit" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="myModalLabel">更新版本信息</h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">

                    <form>
                        <div class="form-group">
                            <label>系统类型</label>
                            <select name="system" class="form-control" ng-model="infos.system">
                                <option value="1">安卓</option>
                                <option value="2">ios</option>
                            </select>
                        </div>
                       
                         <div class="form-group">
                            <label>版本号</label>
                            <input type="text" name="version" ng-model="infos.version" class="form-control"/>
                        </div>
                        
                        <div class="form-group">
                            <label>版本序列号 (最新序列号一定要比之前大)</label>
                            <input type="text" name="version_sort" ng-model="infos.version_sort" class="form-control"/>
                        </div>
                         <div class="form-group">
                            <label>下载链接</label>
                            <input type="text" name="url" ng-model="infos.url" class="form-control"/>
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" ng-click="updateCats()">更新</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>

    function objToArray(arr) {
        var obj = {};
        for (var i = 0; i < arr.length; i++) {
            obj[arr[i].name] = arr[i].value;
        }
        return obj;
    }

    /**
     * 添加
     * @returns {undefined}
     */
    function addor() {
        var temp = $("form[name='ador']").serializeArray();
        var data = objToArray(temp);
        var baseurl = "{:U('Core/addon','model=version')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

    var app = angular.module('myApp', []);
    app.controller('myCtrl', function ($scope, $http) {

        $scope.infos;

        ////////////////////////////////////////////////////////////////////////

        /**
         * 通讯操作
         * @param {type} url
         * @param {type} data
         * @returns {undefined}
         */
        $scope.commAjax = function (url, data, success) {
            $http({
                method: "POST",
                url: url,
                data: data,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                transformRequest: function (obj) {
                    var str = [];
                    for (var p in obj) {
                        str.push(encodeURIComponent(p) + "=" + encodeURIComponent(obj[p]));
                    }
                    return str.join("&");
                }
            }).success(function (response) {
                success(response);
            });
        };

        ////////////////////////////////////////////////////////////////////////

        $scope.updateinfo = function (id) {
            $scope.commAjax("{:U('Core/infos','model=version')}", {ids: id}, function (res) {
                $scope.infos = res.data;
                $("#myEdit").modal("show");
            });
        }

        $scope.updateCats = function () {
            var param = $scope.infos;
            param.ids = param.id;
            /////////
            $.ajax({
                url: "{:U('Core/edits','model=version')}",
                type: "post",
                dataType: 'json',
                data: param,
                success: function (data) {
                    if (data.status !== 1) {
                        return swal("错误", data.msg, "error");
                    }
                    window.location.reload();
                },
                error: function (data) {
                    console.log(data);
                }
            });
        }

        $scope.dels = function (ids) {
            var param = {id: ids};
            $scope.commAjax("{:U('Core/dels','model=version')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

    });

</script>

</body>
</html>
