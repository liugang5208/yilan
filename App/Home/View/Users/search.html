<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>搜索记录</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <!--ol class="breadcrumb text-right">
                        <li><a href="#">Dashboard</a></li>
                        <li class="active">UI-Blank</li>
                    </ol-->
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">

        <div class="row">

            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>搜索记录</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>登录账户</th>
                                        <th>账号备注</th>
                                        <th>搜索类别</th>
                                        <th>关键词</th>
                                        <th width="15%">记录时间</th>
                                    </tr>
                                </thead>
                                <tbody>

                                <volist name="list.list" id="v">
                                    <tr>
                                        <th scope="row">{$v.id}</th>
                                        <td>{$uid|getUsersName=$v['uid'],'phone',###}</td>
                                        <td>{$uid|getUsersName=$v['uid'],'tags',###}</td>
                                        <td>
                                            {$v['types']=='1'?'关键词':''}
                                            {$v['types']=='2'?'物流':''}
                                        </td>
                                        <td>{$v.keyr}</td>
                                        <td>{$v.times|date='Y/m/d H:i:s',###}</td>
                                    </tr>
                                </volist>

                                </tbody>
                            </table>

                            <nav aria-label="Page navigation">
                                <ul class="pagination">{$list.show}</ul>
                            </nav>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>
</div>

<script>

    /**
     * 添加
     * @returns {undefined}
     */
    function addor() {
        var temp = $("form").serializeArray();
        var data = objToArray(temp);
        var baseurl = "{:U('Core/addon','model=shops')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

</script>
