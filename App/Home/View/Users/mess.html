<div class="container-fluid" ng-app="myApp" ng-controller="myCtrl">
    <div class="row">
        <div class="col-lg-8 p-r-0 title-margin-right">
            <div class="page-header">
                <div class="page-title">
                    <h1>注册用户</h1>
                </div>
            </div>
        </div>
        <!-- /# column -->
        <div class="col-lg-4 p-l-0 title-margin-left">
            <div class="page-header">
                <div class="page-title">
                    <!--ol class="breadcrumb text-right">
                        <li><a href="#">Dashboard</a></li>
                        <li class="active">UI-Blank</li>
                    </ol-->
                </div>
            </div>
        </div>
        <!-- /# column -->
    </div>
    <!-- /# row -->
    <section id="main-content">

        <div class="row">

            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>消息记录</h4>
                        <div class="card-header-right-icon">
                            <ul>
                                <li class="doc-link">
                                    <a class="btn btn-xs btn-info" data-toggle="modal" data-target="#myModal">添加新消息</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="card-body">

                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>接收对象</th>
                                    <th>标题</th>
                                    <th>主题</th>
                                    <th>内容</th>
                                    <th width="15%">发布时间</th>
                                    <th>管理</th>
                                </tr>
                            </thead>
                            <tbody>

                            <volist name="list.list" id="v" key="k">
                                <tr>
                                    <th scope="row">{$k}</th>
                                    <td>{$uid|getUsersName=$v['uid'],'nickname',###}</td>
                                    <td>{$v.title}</td>
                                    <td>{$v.theme}</td>
                                    <td>{$v.context}</td>
                                    <td>{$v.times|date='Y/m/d H:i:s',###}</td>
                                    <td>
                                        <a href="javascript:dels('{$v.id}');" class="btn btn-danger btn-xs">删除</a>
                                    </td>
                                </tr>
                            </volist>

                            </tbody>
                        </table>

                        <nav aria-label="Page navigation">
                            <ul class="pagination">{$list.show}</ul>
                        </nav>

                    </div>
                </div>
            </div>

        </div>

    </section>

    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">发送消息</h4>
                </div>
                <div class="modal-body">

                    <div class="row">
                        <form class="col-md-6">
                            <input type="hidden" name="types" value="0"/>
                            <div class="form-group">
                                <label>标题</label>
                                <input type="text" name="title" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label>主题</label>
                                <input type="text" name="theme" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label>主题颜色</label>
                                <select name="color" class="form-control">
                                    <option value="1">绿色</option>
                                    <option value="2">红色</option>
                                    <option value="3">蓝色</option>
                                </select>
                           </div>
                            <div class="form-group">
                                <label>内容</label>
                                <textarea class="form-control" name="context" rows="10"></textarea>
                            </div>
                        </form>

                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addor()">立即发送</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>

    /**
     * 添加
     * @returns {undefined}
     */
    function addor() {
        var temp = $("form").serializeArray();
        var data = objToArray(temp);
        //////
        $.ajax({
            url: "{:U('Users/mess_op')}",
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                return swal('提示', "发送成功", "success");
            },
            error: function () {

            },
        });
    }

    /**
     * 删除
     * @returns {undefined}
     */
    function dels(id) {
        var data = {id: id};
        var baseurl = "{:U('Core/dels','model=sys_msgs')}";
        //////
        $.ajax({
            url: baseurl,
            type: "post",
            data: data,
            dataType: "json",
            success: function (res) {
                if (res.status != 1) {
                    return swal('提示', res.msg, "error");
                }
                window.location.reload();
            },
            error: function () {

            },
        });
    }

</script>
