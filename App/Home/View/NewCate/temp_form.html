<style>
    .apple-backend-container {
        background-color: #f5f5f7;
        padding: 24px 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1d1d1f;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
    }

    .apple-row { margin-bottom: 20px; width: 100%; }

    .apple-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.04);
        overflow: hidden;
        width: 100%;
    }

    .apple-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2c3e50;
        color: #fff;
        padding: 18px 24px;
    }

    .card-title-text { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }

    .apple-header-back-btn {
        font-size: 13px !important;
        padding: 7px 16px !important;
        border-radius: 8px !important;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        background: rgba(255, 255, 255, 0.15) !important;
        color: #fff !important;
    }
    .apple-header-back-btn:hover { background: rgba(255, 255, 255, 0.3) !important; }

    .apple-card-body { padding: 24px; }

    .premium-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: flex-end;
    }
    .premium-toolbar-group { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
    .premium-toolbar-title {
        font-size: 13px;
        font-weight: 600;
        color: #86868b;
        margin-bottom: 8px;
        display: block;
    }

    .apple-input {
        border-radius: 8px !important;
        border: 1px solid #d2d2d7 !important;
        height: 38px !important;
        box-shadow: none !important;
    }
    .apple-input:focus {
        border-color: #0071e3 !important;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15) !important;
    }

    .apple-btn-primary {
        background: #0071e3 !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 8px 18px !important;
        font-weight: 500 !important;
        color: #fff !important;
        height: 38px;
    }
    .apple-btn-primary:hover { background: #0077ed !important; }

    .premium-tpl-link { font-size: 12px; color: #0071e3; margin-left: 4px; }
    .premium-tpl-link:hover { text-decoration: underline; }

    .apple-table-wrapper {
        border-radius: 12px;
        border: 1px solid #e5e5ea;
        overflow: hidden;
        background: #ffffff;
        width: 100%;
    }
    .apple-table { margin-bottom: 0 !important; background-color: #ffffff; width: 100%; }
    .apple-table th {
        background: #fafafc !important;
        color: #1d1d1f !important;
        font-weight: 600 !important;
        border-bottom: 1px solid #e5e5ea !important;
        padding: 14px 16px !important;
        white-space: nowrap;
    }
    .apple-table td { padding: 12px 16px !important; vertical-align: middle !important; border-color: #f0f0f2 !important; color: #1d1d1f; }
    .apple-table tbody tr:nth-of-type(odd) { background-color: #fbfbfd; }
    .apple-table tbody tr:hover { background-color: #f5f5f7; }

    .badge-number {
        font-weight: 600;
        color: #86868b;
        background: #f0f0f2;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
    }

    .row-input {
        width: 100%;
        max-width: 160px;
        border-radius: 8px;
        border: 1px solid #d2d2d7;
        height: 34px;
        padding: 0 10px;
        text-align: center;
    }
    .row-input:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); outline: none; }

    .apple-empty { text-align: center; color: #86868b; padding: 60px 0; font-size: 14px; }

    .premium-footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .premium-footer-tip { font-size: 12px; color: #86868b; }
</style>

<div class="container-fluid apple-backend-container">
    <section id="main-content">

        <div class="row apple-row">
            <div class="col-lg-12">
                <div class="apple-card">
                    <div class="card-header apple-card-header">
                        <span class="card-title-text">公共模版编辑 — {$info.name}</span>
                        <a class="btn btn-xs apple-header-back-btn" href="{:U('NewCate/index')}">&larr; 返回材料管理</a>
                    </div>
                    <div class="card-body apple-card-body">
                        <div class="premium-toolbar">
                            <div class="premium-toolbar-group">
                                <div>
                                    <span class="premium-toolbar-title">模版名称</span>
                                    <input type="text" id="tempName" class="apple-input" style="width:220px;display:inline-block;" value="{$info.name}"/>
                                </div>
                            </div>
                            <div class="premium-toolbar-group">
                                <div>
                                    <span class="premium-toolbar-title">上传表格（覆盖当前模版数据）</span>
                                    <input type="file" name="file" id="tempFile" class="apple-input" style="display:inline-block;padding-top:6px;"/>
                                    <button type="button" class="btn apple-btn-primary" onclick="doImport()">上传导入</button>
                                    <a class="premium-tpl-link" href="/docs/cailiao-common.xlsx" target="_blank">下载导入模板</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row apple-row">
            <div class="col-lg-12">
                <div class="apple-card">
                    <div class="card-header apple-card-header">
                        <span class="card-title-text">规格明细列表</span>
                    </div>
                    <div class="card-body apple-card-body">

                        <empty name="list">
                            <div class="apple-empty">暂无数据，请先在上方上传Excel表格导入规格明细</div>
                        <else />
                        <div class="table-responsive apple-table-wrapper">
                            <table class="table table-hover apple-table">
                                <thead>
                                    <tr>
                                        <th width="80">#</th>
                                        <th>规格</th>
                                        <th width="200">重量(kg)</th>
                                        <th width="200">工电费补偿</th>
                                    </tr>
                                </thead>
                                <tbody id="rowsBody">
                                <volist name="list" id="v">
                                    <tr data-id="{$v.id}">
                                        <td><span class="badge-number">{$v.id}</span></td>
                                        <td><input type="text" class="row-input" style="max-width:220px;" data-field="name" value="{$v.name}"/></td>
                                        <td><input type="text" class="row-input" data-field="weight" value="{$v.weight}"/></td>
                                        <td><input type="text" class="row-input" data-field="extra_ratio" value="{$v.extra_ratio}"/></td>
                                    </tr>
                                </volist>
                                </tbody>
                            </table>
                        </div>
                        </empty>

                        <div class="premium-footer-bar">
                            <span class="premium-footer-tip"><if condition="$list"> 共 {$list|count} 条规格，</if>修改名称/数值后点击"保存修改"生效</span>
                            <button type="button" class="btn apple-btn-primary" onclick="saveAll()">保存修改</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </section>
</div>

<script>

    var tempId = "{$id}";

    function doImport() {
        var fileEl = document.getElementById("tempFile");
        if (!fileEl.files || !fileEl.files.length) {
            return swal("提示", "请先选择要上传的Excel文件", "warning");
        }
        layer.load(2);
        $.ajaxFileUpload({
            url: "{:U('NewCate/temp_import')}",
            secureuri: false,
            fileElementId: "tempFile",
            dataType: 'json',
            data: {id: tempId},
            success: function (data) {
                layer.closeAll('loading');
                if (data.status !== 1) {
                    return swal("错误", data.msg, "error");
                }
                swal("成功", data.msg, "success");
                window.location.reload();
            },
            error: function () {
                layer.closeAll('loading');
                swal("错误", "上传失败，请检查表格格式", "error");
            }
        });
    }

    function saveAll() {
        var form = [];
        $("#rowsBody tr").each(function () {
            var $tr = $(this);
            form.push({
                id: $tr.data("id"),
                name: $tr.find('[data-field="name"]').val(),
                weight: $tr.find('[data-field="weight"]').val(),
                extra_ratio: $tr.find('[data-field="extra_ratio"]').val()
            });
        });
        layer.load(2);
        $.ajax({
            url: "{:U('NewCate/temp_save')}",
            type: "post",
            dataType: "json",
            data: {
                id: tempId,
                name: $("#tempName").val(),
                form: JSON.stringify(form)
            },
            success: function (res) {
                layer.closeAll('loading');
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                swal("成功", res.msg, "success");
                window.location.reload();
            },
            error: function () {
                layer.closeAll('loading');
                swal("错误", "保存失败，请稍后重试", "error");
            }
        });
    }

</script>
