<style>
    /* ==========================================================================
       苹果极简商务风与全局响应式适配样式
       ========================================================================== */
    .container-fluid {
        max-width: 1560px;
        margin: 0 auto;
        padding: 30px 24px;
        background-color: #f5f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1d1d1f;
    }
    /* 卡片设计 */
    .card.alert {
        background: #ffffff;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        margin-bottom: 24px;
        padding: 0;
        overflow: hidden;
    }
    .card-header {
        background: #ffffff;
        border-bottom: 1px solid #f0f0f2;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .card-header h4 {
        font-size: 16px;
        font-weight: 600;
        color: #111111;
        margin: 0;
    }
    .card-body {
        padding: 24px;
    }
    /* 添加按钮样式 */
    .card-header-right-icon ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }
    .card-header-right-icon .btn-info {
        background-color: #0071e3;
        border-color: #0071e3;
        color: #ffffff;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(0, 113, 227, 0.2);
    }
    .card-header-right-icon .btn-info:hover {
        background-color: #0077ed;
        border-color: #0077ed;
    }
    /* 电脑端表格与奇偶行底色 */
    .table-responsive {
        border: none;
        margin-bottom: 0;
    }
    .table {
        width: 100%;
        margin-bottom: 16px;
        border-collapse: separate;
        border-spacing: 0;
    }
    .table > thead > tr > th {
        background-color: #fafafc;
        color: #86868b;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #e5e5ea;
        border-top: none;
        padding: 14px 16px;
        vertical-align: middle;
    }
    .table > tbody > tr > td, .table > tbody > tr > th {
        color: #1d1d1f;
        padding: 16px;
        vertical-align: middle;
        border-top: 1px solid #f2f2f7;
        font-size: 14px;
    }
    .table > tbody > tr:nth-of-type(odd) {
        background-color: #fbfbfd;
    }
    .table > tbody > tr:hover {
        background-color: #f5f5f7;
    }
    /* 状态标签 */
    .status-badge {
        display: inline-block;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 6px;
    }
    .status-badge.normal {
        background-color: #e8f8f0;
        color: #10b981;
    }
    .status-badge.paused {
        background-color: #fef2f2;
        color: #ef4444;
    }
    /* 表格操作按钮 */
    .table .btn {
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 10px;
        margin-right: 4px;
        margin-bottom: 4px;
        transition: all 0.2s ease;
    }
    .table .btn-info {
        background-color: #f2f2f7;
        border-color: #f2f2f7;
        color: #0071e3;
    }
    .table .btn-info:hover {
        background-color: #0071e3;
        border-color: #0071e3;
        color: #ffffff;
    }
    .table .btn-danger {
        background-color: #fff1f2;
        border-color: #fff1f2;
        color: #ef4444;
    }
    .table .btn-danger:hover {
        background-color: #ef4444;
        border-color: #ef4444;
        color: #ffffff;
    }
    /* 手机端卡片降级样式 */
    .mobile-category-cards {
        display: none;
    }
    @media (max-width: 768px) {
        .container-fluid {
            padding: 12px;
        }
        .desktop-table-wrapper {
            display: none;
        }
        .mobile-category-cards {
            display: block;
        }
        .category-mobile-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            margin-bottom: 16px;
            padding: 16px;
            border: 1px solid #f0f0f2;
        }
        .category-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f2f2f7;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .category-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
        }
        .category-card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            font-size: 13px;
            margin-bottom: 14px;
        }
        .category-card-item {
            display: flex;
            flex-direction: column;
        }
        .category-card-label {
            color: #86868b;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .category-card-value {
            color: #1d1d1f;
            font-weight: 500;
        }
        .category-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border-top: 1px solid #f2f2f7;
            padding-top: 12px;
        }
        .category-card-actions .btn {
            flex: 1;
            min-width: calc(33% - 6px);
            height: 40px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .category-card-actions .btn-danger {
            flex-basis: 100%;
            margin-top: 4px;
        }
    }
    /* 弹窗样式优化 */
    .modal-dialog {
        margin: 60px auto;
        width: 90% !important;
        max-width: 500px;
    }
    .modal-content {
        border: none;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    .modal-header {
        background-color: #fafafc;
        border-bottom: 1px solid #f0f0f2;
        padding: 20px 24px;
    }
    .modal-title {
        font-weight: 600;
        color: #111111;
    }
    .modal-body {
        padding: 24px;
    }
    .form-group label {
        font-weight: 500;
        color: #48484a;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .form-control {
        border-radius: 8px;
        border: 1px solid #d2d2d7;
        height: 44px;
        box-shadow: none;
        transition: all 0.2s ease;
    }
    .form-control:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }
    .modal-footer {
        border-top: 1px solid #f0f0f2;
        padding: 16px 24px;
        background-color: #fafafc;
    }
    .modal-footer .btn {
        border-radius: 8px;
        height: 40px;
        padding: 0 20px;
        font-weight: 500;
    }
    .modal-footer .btn-default {
        background-color: #e5e5ea;
        border: none;
        color: #1d1d1f;
    }
    .modal-footer .btn-primary {
        background-color: #0071e3;
        border: none;
    }
</style>

<div class="container-fluid" ng-app="myApp" ng-controller="myCtrl">
    <section id="main-content">
        <div class="row">
            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>店铺分类列表</h4>
                        <div class="card-header-right-icon">
                            <ul>
                                <li class="doc-link">
                                    <a class="btn btn-xs btn-info" data-toggle="modal" data-target="#myModal">添加店铺分类</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="card-body">
                        
                        <!-- 电脑端高清表格视图 -->
                        <div class="table-responsive desktop-table-wrapper">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>名称</th>
                                        <th>排序</th>
                                        <th>状态</th>
                                        <th width="18%">记录时间</th>
                                        <th width="32%">管理操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                <volist name="list.list" id="v" key="k">
                                    <tr>
                                        <th scope="row">{$k}</th>
                                        <td><strong>{$v.name}</strong></td>
                                        <td>{$v.sorts}</td>
                                        <td>
                                            <if condition="$v['status'] gt 0">
                                                <span class="status-badge normal">正常</span>
                                            <else />
                                                <span class="status-badge paused">暂停使用</span>
                                            </if>
                                        </td>
                                        <td>{$v.times|date='Y/m/d H:i:s',###}</td>
                                        <td>
                                            <a href="{:U('Goods/plate_banner','id='.$v['id'])}" class="btn btn-info btn-xs">广告管理</a>
                                            <a href="{:U('Goods/plate_infos','id='.$v['id'])}" class="btn btn-info btn-xs">商品管理</a>
                                            <a ng-click="changeid('{$v.id}', 1)" class="btn btn-info btn-xs">上调顺序</a>
                                            <a ng-click="changeid('{$v.id}', 0)" class="btn btn-info btn-xs">下调顺序</a>
                                            <a ng-click="updateInfo('{$v.id}')" class="btn btn-info btn-xs">编辑</a>
                                            <a class="btn btn-danger btn-xs" ng-click="dels('{$v.id}')">删除</a>
                                        </td>
                                    </tr>
                                </volist>
                                </tbody>
                            </table>
                        </div>

                        <!-- 手机端卡片式折叠视图（零内容丢失） -->
                        <div class="mobile-category-cards">
                            <volist name="list.list" id="v" key="k">
                                <div class="category-mobile-card">
                                    <div class="category-card-header">
                                        <span class="category-card-title">#{$k} - {$v.name}</span>
                                        <if condition="$v['status'] gt 0">
                                            <span class="status-badge normal">正常</span>
                                        <else />
                                            <span class="status-badge paused">暂停使用</span>
                                        </if>
                                    </div>
                                    <div class="category-card-body">
                                        <div class="category-card-item">
                                            <span class="category-card-label">排序权重</span>
                                            <span class="category-card-value">{$v.sorts}</span>
                                        </div>
                                        <div class="category-card-item">
                                            <span class="category-card-label">记录时间</span>
                                            <span class="category-card-value">{$v.times|date='Y/m/d H:i:s',###}</span>
                                        </div>
                                    </div>
                                    <div class="category-card-actions">
                                        <a href="{:U('Goods/plate_banner','id='.$v['id'])}" class="btn btn-info btn-xs">广告管理</a>
                                        <a href="{:U('Goods/plate_infos','id='.$v['id'])}" class="btn btn-info btn-xs">商品管理</a>
                                        <a ng-click="changeid('{$v.id}', 1)" class="btn btn-info btn-xs">上调顺序</a>
                                        <a ng-click="changeid('{$v.id}', 0)" class="btn btn-info btn-xs">下调顺序</a>
                                        <a ng-click="updateInfo('{$v.id}')" class="btn btn-info btn-xs">编辑分类</a>
                                        <a class="btn btn-danger btn-xs" ng-click="dels('{$v.id}')">删除分类</a>
                                    </div>
                                </div>
                            </volist>
                        </div>

                        <nav aria-label="Page navigation" style="text-align: center; margin-top: 20px;">
                            <ul class="pagination">{$list.show}</ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 添加店铺分类弹窗 -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">添加店铺分类</h4>
                </div>
                <div class="modal-body">
                    <form name="addon">
                        <input type="hidden" name="types" value="3"/>
                        <input type="hidden" name="types_id" value="{$id}"/>

                        <div class="form-group">
                            <label>名称</label>
                            <input type="text" name="name" class="form-control" placeholder="请输入分类名称"/>
                        </div>
                        <div class="form-group">
                            <label>排序</label>
                            <input type="number" name="sorts" class="form-control" value="0"/>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control">
                                <option value="1">使用</option>
                                <option value="0">暂停</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" ng-click="addor()">确认添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改店铺分类弹窗 -->
    <div class="modal fade" id="myEdits" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">修改店铺分类</h4>
                </div>
                <div class="modal-body">
                    <form name="edit">
                        <div class="form-group">
                            <label>名称</label>
                            <input type="text" name="name" class="form-control" ng-model="lininfo.name"/>
                        </div>
                        <div class="form-group">
                            <label>排序</label>
                            <input type="text" name="sorts" class="form-control" ng-model="lininfo.sorts"/>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control" ng-model="lininfo.status">
                                <option value="1">使用</option>
                                <option value="0">暂停</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" ng-click="updateOp()">确认更新</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var app = angular.module('myApp', []);
    app.controller('myCtrl', function ($scope, $http) {
        $scope.lininfo;

        /**
         * 通讯操作
         */
        $scope.commAjax = function (url, data, success) {
            $http({
                method: "POST",
                url: url,
                data: data,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                transformRequest: function (obj) {
                    var str = [];
                    for (var p in obj) {
                        str.push(encodeURIComponent(p) + "=" + encodeURIComponent(obj[p]));
                    }
                    return str.join("&");
                }
            }).success(function (response) {
                success(response);
            });
        };

        $scope.addor = function () {
            var temp = $("form[name='addon']").serializeArray();
            var data = objToArray(temp);
            $.ajaxFileUpload({
                url: "{:U('Core/addon','model=plate_types')}",
                secureuri: false,
                fileElementId: "file",
                dataType: 'json',
                data: data,
                success: function (data) {
                    if (data.status !== 1) {
                        return swal("错误", data.msg, "error");
                    }
                    window.location.reload();
                },
                error: function (data) {
                    console.log(data);
                }
            });
        }

        $scope.updateInfo = function (id) {
            $scope.commAjax("{:U('Core/infos','model=plate_types')}", {ids: id}, function (res) {
                $scope.lininfo = res.data;
                $("#myEdits").modal("show");
            });
        }

        $scope.updateOp = function () {
            var param = $scope.lininfo;
            param.ids = param.id;
            $scope.commAjax("{:U('Core/edits','model=plate_types')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

        $scope.dels = function (ids) {
            var param = {id: ids};
            $scope.commAjax("{:U('Core/dels','model=plate_types')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }

        $scope.changeid = function (id, type) {
            var param = {id: id, redi: type};
            $scope.commAjax("{:U('Core/uptypes')}", param, function (res) {
                if (res.status !== 1) {
                    return swal("错误", res.msg, "error");
                }
                window.location.reload();
            });
        }
    });
</script>
