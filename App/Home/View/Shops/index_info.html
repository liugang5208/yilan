<style>
    /* ==========================================================================
       苹果极简商务风与编辑器专属适配样式
       ========================================================================== */
    .container-fluid {
        max-width: 1560px;
        margin: 0 auto;
        padding: 30px 24px;
        background-color: #f5f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1d1d1f;
    }
    .card.alert {
        background: #ffffff;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        margin-bottom: 24px;
        padding: 0;
        overflow: hidden;
    }
    .card-header {
        background: #ffffff;
        border-bottom: 1px solid #f0f0f2;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .card-header h4 {
        font-size: 16px;
        font-weight: 600;
        color: #111111;
        margin: 0;
    }
    .card-body {
        padding: 24px;
    }
    .form-group label {
        font-weight: 500;
        color: #48484a;
        margin-bottom: 8px;
        font-size: 13px;
        display: block;
    }
    /* 编辑器整体外边框润色 */
    .ke-container {
        border-radius: 10px !important;
        overflow: hidden;
        border-color: #d2d2d7 !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .ke-toolbar {
        background-color: #fafafc !important;
        border-bottom: 1px solid #e5e5ea !important;
        padding: 6px !important;
    }
    .btn-primary {
        background-color: #0071e3;
        border-color: #0071e3;
        color: #ffffff;
        font-weight: 500;
        padding: 10px 28px;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(0, 113, 227, 0.2);
        margin-top: 24px;
        height: 44px;
    }
    .btn-primary:hover {
        background-color: #0077ed;
        border-color: #0077ed;
    }
    @media (max-width: 768px) {
        .container-fluid {
            padding: 12px;
        }
        .card-body {
            padding: 16px;
        }
    }
</style>

<!-- 引入稳定高效的 Kindeditor 核心脚本 -->
<script charset="utf-8" src="__PUBLIC__/libs/kindeditor/kindeditor-all.js"></script>
<script charset="utf-8" src="__PUBLIC__/libs/kindeditor/lang/zh-CN.js"></script>

<div class="container-fluid">
    <section id="main-content">
        <div class="row">
            <div class="col-lg-12">
                <div class="card alert">
                    <div class="card-header">
                        <h4>店铺内容编辑</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <form name="addon">
                                    <input type="hidden" name="ids" value="{$id}"/>
                                    <div class="form-group">
                                        <label>详细内容</label>
                                        <textarea name="{$tar}" class="form-control" id="editor_id" rows="20">{$context}</textarea>
                                    </div>
                                    <button type="button" class="btn btn-primary" onclick="addor()">确认更新</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    KindEditor.ready(function (K) {
        window.editor = K.create('#editor_id', {
            width: '100%',
            height: '480px',
            resizeType: 1,
            uploadJson: '', // 保持原有配置
            allowFileManager: true,
            afterCreate: function() {
                this.sync();
            },
            afterChange: function() {
                this.sync();
            }
        });
    });

    function addor() {
        editor.sync();
        var temp = $("form[name='addon']").serializeArray();
        var data = objToArray(temp);
        
        $.ajax({
            url: "{:U('Core/edits','model=shops')}",
            type: "post",
            dataType: 'json',
            data: data,
            success: function (data) {
                if (data.status !== 1) {
                    return swal("错误", data.msg, "error");
                }
                swal({
                    title: "成功",
                    text: "内容更新成功！",
                    type: "success"
                }, function() {
                    window.location.reload();
                });
            },
            error: function (data) {
                console.log(data);
                swal("错误", "网络请求失败，请稍后重试", "error");
            }
        });
    }
</script>
